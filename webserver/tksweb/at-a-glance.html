<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>At a Glance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Glance" />
  <meta name="theme-color" content="#15140f" id="themeColorMeta" />
  <script>
    // Apply the board's theme before first paint. The board config lives in the URL
    // hash (#cfg=base64url JSON) with a newer local copy winning; see loadConfig().
    (function () {
      try {
        var c = null, m = /[#&]cfg=([^&]+)/.exec(location.hash);
        if (m) {
          var s = m[1].replace(/-/g, '+').replace(/_/g, '/');
          while (s.length % 4) s += '=';
          c = JSON.parse(decodeURIComponent(escape(atob(s))));
        }
        if (c && c.id) {
          var local = JSON.parse(localStorage.getItem('gtfs-glance:' + c.id) || 'null');
          if (local && (local.t || 0) > (c.t || 0)) c = local;
        }
        if (!c && !/[#&]new\b/.test(location.hash)) c = JSON.parse(localStorage.getItem('gtfs-glance-last') || 'null');
        var theme = (c && c.theme) || 'auto';
        if (theme === 'auto') theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-size', (c && c.size) || 'm');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="stylesheet" href="/vendor/fonts/fonts.css">
  <style>
    /* Fonts per theme (the theme blocks below override); also on [data-theme] so the
       setup's theme previews get their own theme's fonts. */
    :root, [data-theme] {
      --font-display: 'Oswald', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
      --font-board: 'Saira', sans-serif;
    }
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --gutter-l: max(16px, var(--safe-left));
      --gutter-r: max(16px, var(--safe-right));
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --t-fast: 150ms;
      --t-med: 260ms;
    }

    /* ===== Ink (dark, default) — same palette as the other boards ===== */
    :root, [data-theme="dark"] {
      --bg: #15140f;
      --surface: #1d1c15;
      --surface2: #24231a;
      --surface3: #2d2b1f;
      --border: rgba(250,250,247,0.14);
      --border2: rgba(250,250,247,0.28);
      --text: #FAFAF7;
      --text-muted: rgba(250,250,247,0.72);
      --text-dim: rgba(250,250,247,0.50);
      --accent: #6FA0E8;
      --accent-rgb: 111,160,232;
      --positive: #4FA876;
      --positive-rgb: 79,168,118;
      --negative: #E8674B;
      --negative-rgb: 232,103,75;
      --warn-rgb: 240,165,50;
      --ontime-rgb: 74,184,170;
      --overlay: rgba(0,0,0,0.55);
      --shadow: 4px 4px 0 rgba(0,0,0,0.4);
      --lift: 2px 2px 0 rgba(0,0,0,0.45);
      color-scheme: dark;
    }

    /* ===== Paper (light) ===== */
    [data-theme="light"] {
      --bg: #FAFAF7;
      --surface: #ffffff;
      --surface2: #f4f1ea;
      --surface3: #eae5d9;
      --border: rgba(26,26,26,0.15);
      --border2: rgba(26,26,26,0.32);
      --text: #1A1A1A;
      --text-muted: rgba(26,26,26,0.68);
      --text-dim: rgba(26,26,26,0.50);
      --accent: #2B5FAD;
      --accent-rgb: 43,95,173;
      --positive: #2F7B4F;
      --positive-rgb: 47,123,79;
      --negative: #C23B24;
      --negative-rgb: 194,59,36;
      --warn-rgb: 176,108,0;
      --ontime-rgb: 20,133,120;
      --overlay: rgba(26,26,26,0.35);
      --shadow: 4px 4px 0 rgba(26,26,26,0.10);
      --lift: 2px 2px 0 rgba(26,26,26,0.14);
      color-scheme: light;
    }

    /* ===== Midnight — true black for OLED phones and always-on screens ===== */
    [data-theme="midnight"] {
      --bg: #000000;
      --surface: #0b0b0b;
      --surface2: #151515;
      --surface3: #1f1f1f;
      --border: rgba(255,255,255,0.11);
      --border2: rgba(255,255,255,0.24);
      --text: #F2F2F2;
      --text-muted: rgba(242,242,242,0.68);
      --text-dim: rgba(242,242,242,0.45);
      --accent: #7FAEF0;
      --accent-rgb: 127,174,240;
      --positive: #55B57F;
      --positive-rgb: 85,181,127;
      --negative: #EF6F55;
      --negative-rgb: 239,111,85;
      --warn-rgb: 240,170,60;
      --ontime-rgb: 80,190,176;
      --overlay: rgba(0,0,0,0.7);
      --shadow: none;
      --lift: 2px 2px 0 rgba(255,255,255,0.12);
      color-scheme: dark;
    }

    /* ===== Signal — amber LED departure sign ===== */
    [data-theme="signal"] {
      --bg: #0a0805;
      --surface: #110d07;
      --surface2: #1a140b;
      --surface3: #241c10;
      --border: rgba(255,181,71,0.16);
      --border2: rgba(255,181,71,0.32);
      --text: #FFB547;
      --text-muted: rgba(255,181,71,0.74);
      --text-dim: rgba(255,181,71,0.48);
      --accent: #FFB547;
      --accent-rgb: 255,181,71;
      --positive: #9BD86A;
      --positive-rgb: 155,216,106;
      --negative: #FF6A4D;
      --negative-rgb: 255,106,77;
      --warn-rgb: 255,214,102;
      --ontime-rgb: 155,216,106;
      --overlay: rgba(0,0,0,0.7);
      --shadow: none;
      --lift: 2px 2px 0 rgba(255,181,71,0.22);
      color-scheme: dark;
    }

    /* ===== Ticket — cream ticket stock, red ink (card shape: see "Theme shapes") ===== */
    [data-theme="ticket"] {
      --font-board: 'Oswald', sans-serif;
      --bg: #D8CFBA;
      --surface: #FBF5E6;
      --surface2: #F3EAD3;
      --surface3: #E8DCBE;
      --border: rgba(74,52,28,0.18);
      --border2: rgba(74,52,28,0.36);
      --text: #2B2117;
      --text-muted: rgba(43,33,23,0.72);
      --text-dim: rgba(43,33,23,0.52);
      --accent: #B0322A;
      --accent-rgb: 176,50,42;
      --positive: #2F7B4F;
      --positive-rgb: 47,123,79;
      --negative: #B0322A;
      --negative-rgb: 176,50,42;
      --warn-rgb: 160,104,0;
      --ontime-rgb: 28,116,100;
      --overlay: rgba(43,33,23,0.35);
      --shadow: none;
      --lift: 2px 2px 0 rgba(74,52,28,0.2);
      color-scheme: light;
    }

    /* ===== Receipt — thermal paper, all monospace ===== */
    [data-theme="receipt"] {
      --font-display: 'IBM Plex Mono', monospace;
      --font-body: 'IBM Plex Mono', monospace;
      --font-board: 'IBM Plex Mono', monospace;
      --bg: #CDD0D4;
      --surface: #FFFFFF;
      --surface2: #F3F3F1;
      --surface3: #E6E6E3;
      --border: rgba(20,20,20,0.16);
      --border2: rgba(20,20,20,0.4);
      --text: #1B1B1B;
      --text-muted: rgba(27,27,27,0.7);
      --text-dim: rgba(27,27,27,0.5);
      --accent: #1B1B1B;
      --accent-rgb: 27,27,27;
      --positive: #2B7049;
      --positive-rgb: 43,112,73;
      --negative: #B3261E;
      --negative-rgb: 179,38,30;
      --warn-rgb: 150,96,0;
      --ontime-rgb: 27,27,27;
      --overlay: rgba(20,20,20,0.35);
      --shadow: none;
      --lift: 2px 2px 0 rgba(20,20,20,0.18);
      color-scheme: light;
    }

    /* ===== Platform — station departure sign: navy, white, sign yellow ===== */
    [data-theme="platform"] {
      --font-display: 'Inter', sans-serif;
      --bg: #0A1325;
      --surface: #111F3B;
      --surface2: #182A4D;
      --surface3: #22375F;
      --border: rgba(255,255,255,0.12);
      --border2: rgba(255,255,255,0.26);
      --text: #FFFFFF;
      --text-muted: rgba(255,255,255,0.74);
      --text-dim: rgba(255,255,255,0.5);
      --accent: #FFC72C;
      --accent-rgb: 255,199,44;
      --positive: #4CC38A;
      --positive-rgb: 76,195,138;
      --negative: #FF6B5A;
      --negative-rgb: 255,107,90;
      --warn-rgb: 255,166,77;
      --ontime-rgb: 76,195,138;
      --overlay: rgba(0,0,0,0.6);
      --shadow: none;
      --lift: 2px 2px 0 rgba(0,0,0,0.5);
      color-scheme: dark;
    }

    /* Board text scales with the chosen size; the setup panel stays in px. */
    html { font-size: 16px; }
    html[data-size="l"] { font-size: 20px; }
    html[data-size="xl"] { font-size: 26px; }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    html, body { background: var(--bg); color: var(--text); }
    /* Theme previews in setup cross-fade instead of snapping */
    html, body, .card, .setup-sheet, .setup-foot, .ce, .then-item {
      transition: background-color var(--t-med) ease, border-color var(--t-med) ease, color var(--t-med) ease;
    }
    body {
      font-family: var(--font-body);
      min-height: 100vh;
      min-height: 100dvh;
      font-variant-emoji: text;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      padding-bottom: calc(var(--safe-bottom) + 16px);
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ===== Header ===== */
    .top {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: calc(var(--safe-top) + 0.75rem) var(--gutter-r) 0.75rem var(--gutter-l);
    }
    .top-text { min-width: 0; }
    .top-title {
      font-family: var(--font-display);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 1.35rem;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .top-date {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.45rem;
      margin-top: 0.15rem;
    }
    .live-dot {
      width: 0.5rem; height: 0.5rem; border-radius: 50%;
      background: var(--text-dim);
      flex-shrink: 0;
      transition: background-color 0.4s ease;
    }
    .live-dot.ok { background: var(--positive); animation: dot-pulse 2.4s ease-in-out infinite; }
    .live-dot.stale { background: rgb(var(--warn-rgb)); }
    .live-dot.err { background: var(--negative); }
    @keyframes dot-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .top-clock {
      margin-left: auto;
      font-family: var(--font-board);
      font-weight: 600;
      font-size: 1.9rem;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .top-clock small { font-size: 0.45em; margin-left: 0.2em; color: var(--text-muted); font-weight: 500; }
    .top-actions { display: flex; gap: 6px; transition: opacity 0.4s ease; }
    .icon-btn {
      width: 40px; height: 40px;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 4px;
      color: var(--text-muted);
      flex-shrink: 0;
      transition: color var(--t-fast) ease, background-color var(--t-fast) ease, border-color var(--t-fast) ease,
                  box-shadow var(--t-fast) ease, transform var(--t-fast) var(--ease-out);
    }
    .icon-btn svg { width: 20px; height: 20px; transition: transform var(--t-med) var(--ease-out); }
    .icon-btn svg.ico-gear { transition-duration: 0.6s; }
    @media (hover: hover) {
      .icon-btn:hover { color: var(--text); border-color: var(--border2); background: var(--surface2); transform: translate(-1px, -1px); box-shadow: var(--lift); }
      .icon-btn:hover .ico-gear { transform: rotate(60deg); }
      .icon-btn:hover .ico-x { transform: rotate(90deg); }
      .icon-btn:hover .ico-up { transform: translateY(-2px); }
      .icon-btn:hover .ico-down { transform: translateY(2px); }
    }
    .icon-btn:active { transform: scale(0.94); box-shadow: none; transition-duration: 60ms; }
    .icon-btn:disabled { opacity: 0.35; cursor: default; pointer-events: none; }

    /* Full-screen icon: corners spread on hover and swap to "exit" while full screen */
    .fs-ico g { transform-box: view-box; transform-origin: center; transition: opacity var(--t-med) ease, transform var(--t-med) var(--ease-out); }
    .fs-ico path { transition: transform var(--t-med) var(--ease-out); }
    .fs-ico .fs-exit { opacity: 0; transform: scale(0.6); }
    .is-fs .fs-ico .fs-enter { opacity: 0; transform: scale(1.35); }
    .is-fs .fs-ico .fs-exit { opacity: 1; transform: none; }
    .c-tl { --dx: -1; --dy: -1; } .c-tr { --dx: 1; --dy: -1; } .c-bl { --dx: -1; --dy: 1; } .c-br { --dx: 1; --dy: 1; }
    @media (hover: hover) {
      .icon-btn:hover .fs-enter path { transform: translate(calc(var(--dx) * 1.5px), calc(var(--dy) * 1.5px)); }
      .icon-btn:hover .fs-exit path { transform: translate(calc(var(--dx) * -1.5px), calc(var(--dy) * -1.5px)); }
    }
    body.idle { cursor: none; }
    body.idle .top-actions:not(:focus-within) { opacity: 0; }

    /* ===== Cards ===== */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr));
      gap: 1rem;
      padding: 0.25rem var(--gutter-r) 0 var(--gutter-l);
      align-items: start;
    }
    .cards[data-n="1"] { max-width: 48rem; margin: 0 auto; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1rem 1rem 0.75rem;
      box-shadow: var(--shadow);
      min-width: 0;
      animation: card-in 480ms var(--ease-out) backwards;
      animation-delay: calc(var(--i, 0) * 70ms);
    }
    @keyframes card-in { from { opacity: 0; transform: translateY(12px); } }
    /* Departures that just appeared fade up; ones that moved glide there (see animateRows) */
    .enter { animation: row-in 420ms var(--ease-out) backwards; }
    .then-item.enter { animation-name: chip-in; }
    @keyframes row-in { from { opacity: 0; transform: translateY(8px); } }
    @keyframes chip-in { from { opacity: 0; transform: scale(0.85); } }
    .card-title {
      font-family: var(--font-display);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      font-size: 1.15rem;
      line-height: 1.2;
    }
    .card-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
      font-family: var(--font-mono);
    }
    .card-rows { margin-top: 0.5rem; }
    .card-msg { color: var(--text-muted); padding: 1rem 0 0.5rem; font-size: 0.95rem; }
    .card-msg.err { color: var(--negative); }

    .route-pill {
      font-family: var(--font-board);
      font-weight: 700;
      font-size: 1.05rem;
      line-height: 1;
      min-width: 3rem;
      text-align: center;
      padding: 0.35rem 0.5rem;
      border-radius: 3px;
      background: var(--surface3);
      color: var(--text);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .route-pill.sm { font-size: 0.8rem; min-width: 2.2rem; padding: 0.25rem 0.35rem; }

    .dep {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 0.75rem;
      align-items: center;
      padding: 0.7rem 0;
      border-top: 1px solid var(--border);
    }
    .dep:first-child { border-top: 0; }
    .dep-head {
      font-weight: 600;
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dep-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.3rem 0.5rem;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }
    .dep-when { text-align: right; white-space: nowrap; }
    .cd {
      font-family: var(--font-board);
      font-variant-numeric: tabular-nums;
      line-height: 1;
      white-space: nowrap;
    }
    .cd b { font-size: 2rem; font-weight: 700; display: inline-block; }
    /* A countdown number rolls in when it changes (class set by updateTimers) */
    .cd.tick b { animation: cd-tick 360ms var(--ease-out); }
    @keyframes cd-tick { from { opacity: 0.15; transform: translateY(-0.2em); } }
    .cd small {
      font-size: 0.8rem;
      margin-left: 0.15rem;
      margin-right: 0.15rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .cd small:last-child { margin-right: 0; }
    .clk { font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-muted); margin-top: 0.25rem; }
    .clk s { opacity: 0.65; margin-left: 0.3rem; }
    .is-cancelled .cd, .is-cancelled .clk, .is-cancelled .dep-head, .is-cancelled .hero-head { text-decoration: line-through; opacity: 0.55; }

    /* Hero layout: the next bus big, the rest as a strip */
    .hero { padding: 0.25rem 0 0.75rem; }
    .hero-top { display: flex; align-items: center; gap: 0.75rem; min-width: 0; }
    .hero .route-pill { font-size: 1.5rem; padding: 0.4rem 0.6rem; }
    .hero-head { font-size: 1.25rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hero-when { display: flex; align-items: baseline; gap: 1rem; margin-top: 0.6rem; flex-wrap: wrap; }
    .hero .cd b { font-size: 5rem; }
    .hero .cd small { font-size: 1.4rem; }
    .hero .clk { font-size: 1rem; }
    .hero .dep-meta { font-size: 0.9rem; margin-top: 0.5rem; }
    .then {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
    }
    .then-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); font-weight: 600; }
    .then-item {
      display: flex; align-items: center; gap: 0.45rem;
      background: var(--surface2);
      border-radius: 3px;
      padding: 0.3rem 0.55rem 0.3rem 0.3rem;
    }
    .then-item .cd b { font-size: 1.15rem; }
    .then-item .cd small { font-size: 0.65rem; }
    .then-item .badge { font-size: 0.68rem; }

    /* RT badges — same colours as the departure board */
    .badge {
      display: inline-block;
      padding: 0.12rem 0.4rem;
      border-radius: 3px;
      font-size: 0.74rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .b-ontime { background: rgba(var(--ontime-rgb), 0.14); color: rgb(var(--ontime-rgb)); }
    .b-early  { background: rgba(var(--positive-rgb), 0.12); color: var(--positive); }
    .b-late   { background: rgba(var(--negative-rgb), 0.12); color: var(--negative); }
    .b-slight { background: rgba(var(--warn-rgb), 0.16); color: rgb(var(--warn-rgb)); }
    .b-live   { background: rgba(var(--accent-rgb), 0.12); color: var(--accent); }
    .b-cancel { background: rgba(var(--negative-rgb), 0.18); color: var(--negative); }
    .b-sched  { background: transparent; color: var(--text-dim); padding-left: 0; padding-right: 0; font-weight: 500; }

    .vgroup { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 0.1rem 0; }
    .vi-ico {
      width: 0.5rem; height: 0.5rem; border-radius: 50%;
      background: var(--accent);
      margin-right: 0.4rem;
      box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0.5);
      animation: veh-ping 2s ease-out infinite;
    }
    @keyframes veh-ping { 0% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0.5); } 100% { box-shadow: 0 0 0 0.45rem rgba(var(--accent-rgb), 0); } }
    .vgroup .vi + .vi::before { content: '·'; margin: 0 0.4em; opacity: 0.6; }
    .vi { white-space: nowrap; }
    .vi-away { color: var(--text); font-weight: 600; }
    .vi-away.passed { color: var(--text-dim); font-weight: 500; }
    .vi-age.stale { color: var(--negative); }
    .vi-none { color: var(--text-dim); }

    /* Alerts */
    .card-alerts:not(:empty) { margin-top: 0.6rem; display: grid; gap: 0.35rem; }
    .alert {
      border-left: 3px solid rgb(var(--warn-rgb));
      background: rgba(var(--warn-rgb), 0.08);
      border-radius: 0 3px 3px 0;
      padding: 0.4rem 0.6rem;
      font-size: 0.8rem;
    }
    .alert summary { cursor: pointer; font-weight: 600; list-style: none; }
    .alert summary::-webkit-details-marker { display: none; }
    .alert summary::before { content: '⚠︎ '; color: rgb(var(--warn-rgb)); }
    .alert:has(> p) summary::after {
      content: '';
      display: inline-block;
      width: 0.4em; height: 0.4em;
      margin-left: 0.55em;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      opacity: 0.6;
      transform: translateY(-0.2em) rotate(45deg);
      transition: transform var(--t-med) var(--ease-out);
    }
    .alert[open] summary::after { transform: translateY(0.05em) rotate(-135deg); }
    .alert p { margin-top: 0.35rem; color: var(--text-muted); line-height: 1.4; }
    /* Only on a tap/click, so re-renders of an already-open alert don't replay it */
    .alert.anim[open] > p { animation: row-in var(--t-med) var(--ease-out); }
    .alert-more { font-size: 0.75rem; color: var(--text-dim); }

    /* Map */
    .card-map {
      height: clamp(180px, 15rem, 440px);
      margin-top: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: var(--surface2);
      overflow: hidden;
      position: relative;
      z-index: 0;
    }
    .card-map .map-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 0.85rem; }
    :root:is([data-theme="dark"], [data-theme="midnight"], [data-theme="platform"]) .leaflet-tile-pane {
      filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9);
    }
    :root[data-theme="signal"] .leaflet-tile-pane {
      filter: invert(1) hue-rotate(180deg) sepia(0.7) brightness(0.75) contrast(0.95);
    }
    :root[data-theme="ticket"] .leaflet-tile-pane { filter: sepia(0.45) saturate(0.8); }
    :root[data-theme="receipt"] .leaflet-tile-pane { filter: grayscale(1) contrast(1.05); }
    .leaflet-container { background: var(--surface2); font-family: var(--font-body); }
    .leaflet-control-attribution { font-size: 9px !important; background: var(--surface) !important; color: var(--text-dim) !important; }
    .leaflet-control-attribution a { color: var(--text-muted) !important; }
    .map-stop div {
      width: 16px; height: 16px;
      background: var(--text);
      border: 3px solid var(--bg);
      border-radius: 3px;
      box-shadow: 0 0 0 2px var(--text);
      animation: pop-in 420ms var(--ease-spring) backwards;
    }
    @keyframes pop-in { from { opacity: 0; transform: scale(0.3); } }
    .map-veh {
      position: absolute;
      left: 0; top: 0;
      transform: translate(-50%, -50%);
      background: var(--c);
      color: var(--fg);
      font: 700 12px/1 var(--font-board);
      padding: 4px 7px;
      border-radius: 11px;
      white-space: nowrap;
      box-shadow: 0 0 0 2px var(--bg);
      animation: veh-in 420ms var(--ease-spring) backwards;
    }
    @keyframes veh-in { from { opacity: 0; transform: translate(-50%, -50%) scale(0.3); } }
    .map-veh::after {
      content: '';
      position: absolute; inset: -2px;
      border-radius: 13px;
      border: 2px solid var(--c);
      animation: map-ping 2s ease-out infinite;
    }
    @keyframes map-ping { 0% { opacity: 0.9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.6); } }

    /* Empty board */
    .empty {
      max-width: 30rem;
      margin: 12vh auto 0;
      padding: 0 var(--gutter-r) 0 var(--gutter-l);
      text-align: center;
      animation: card-in 520ms var(--ease-out) backwards;
    }
    .empty h2 { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.04em; font-size: 1.6rem; }
    .empty p { color: var(--text-muted); margin: 0.75rem 0 1.25rem; line-height: 1.5; }

    /* ===== Buttons (setup sizes are px so they don't scale with board text) ===== */
    .btn {
      border: 1px solid var(--border2);
      background: var(--surface);
      border-radius: 4px;
      padding: 9px 14px;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color var(--t-fast) ease, border-color var(--t-fast) ease, color var(--t-fast) ease,
                  box-shadow var(--t-fast) ease, transform var(--t-fast) var(--ease-out), filter var(--t-fast) ease;
    }
    .btn svg { width: 16px; height: 16px; flex-shrink: 0; transition: transform var(--t-med) var(--ease-out); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    .btn-sm { padding: 6px 10px; font-size: 13px; }
    .btn-sm svg { width: 14px; height: 14px; }
    @media (hover: hover) {
      .btn:hover { border-color: var(--text-muted); background: var(--surface2); transform: translate(-1px, -1px); box-shadow: var(--lift); }
      .btn-primary:hover { background: var(--accent); border-color: var(--accent); filter: brightness(1.08); }
      .btn:hover .ico-plus { transform: rotate(90deg); }
      .btn:hover .ico-near { transform: translate(1.5px, -1.5px); }
      .btn:hover .ico-link { transform: rotate(-20deg); }
    }
    .btn:active { transform: scale(0.97); box-shadow: none; transition-duration: 60ms; }
    .ss-near.busy svg { animation: dot-pulse 1s ease-in-out infinite; }

    /* ===== Setup panel ===== */
    .setup {
      position: fixed; inset: 0;
      z-index: 2000;
      background: var(--overlay);
      display: flex;
      justify-content: flex-end;
    }
    /* Opens by sliding in; closeSetup() adds .closing and hides it once this plays out */
    .setup:not([hidden]) { animation: fade-in var(--t-med) ease backwards; }
    .setup:not([hidden]) .setup-sheet { animation: sheet-in 380ms var(--ease-out) backwards; }
    .setup.closing { animation: fade-out 220ms ease forwards; pointer-events: none; }
    .setup.closing .setup-sheet { animation: sheet-out 220ms cubic-bezier(0.4, 0, 1, 1) forwards; }
    @keyframes fade-in { from { opacity: 0; } }
    @keyframes fade-out { to { opacity: 0; } }
    @keyframes sheet-in { from { transform: translateX(100%); } }
    @keyframes sheet-out { to { transform: translateX(100%); } }
    .setup-sheet {
      width: min(560px, 100%);
      height: 100%;
      background: var(--bg);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      font-size: 14px;
    }
    .setup-head {
      display: flex; align-items: center; gap: 12px;
      padding: calc(var(--safe-top) + 14px) max(20px, var(--safe-right)) 14px 20px;
      border-bottom: 1px solid var(--border);
    }
    .setup-head h2 { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.05em; font-size: 20px; font-weight: 600; flex: 1; }
    .setup-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px max(20px, var(--safe-right)) 24px 20px; }
    .setup-foot {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 12px max(20px, var(--safe-right)) calc(var(--safe-bottom) + 12px) 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .setup-foot .grow { flex: 1; }
    .sg { padding: 18px 0; border-bottom: 1px solid var(--border); }
    .sg:last-child { border-bottom: 0; }
    .sg h3 {
      font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text-dim); font-weight: 700; margin-bottom: 12px;
    }
    .field { display: block; margin-top: 12px; }
    .field > span { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    .field small, .check small { color: var(--text-dim); font-weight: 400; }
    .text-input, .field select {
      width: 100%;
      border: 1px solid var(--border2);
      background: var(--surface);
      border-radius: 4px;
      padding: 9px 11px;
      font-size: 16px; /* 16px stops iOS zooming on focus */
      transition: border-color var(--t-fast) ease, box-shadow var(--t-fast) ease, background-color var(--t-med) ease, color var(--t-med) ease;
    }
    .text-input:focus, .field select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.22); }
    .field select { width: auto; min-width: 90px; }
    .seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--border2); border-radius: 4px; overflow: hidden; }
    .seg button {
      border: 0; background: var(--surface);
      padding: 8px 13px; font-size: 13px; font-weight: 600;
      border-left: 1px solid var(--border);
      transition: background-color var(--t-fast) ease, color var(--t-fast) ease;
    }
    .seg button:first-child { border-left: 0; }
    @media (hover: hover) { .seg button:not([aria-pressed="true"]):hover { background: var(--surface2); } }
    .seg button:not([aria-pressed="true"]):active { background: var(--surface3); }
    .seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
    .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
    .swatch {
      width: 32px; height: 32px; border-radius: 50%;
      border: 2px solid var(--border2);
      background: var(--sw);
      box-shadow: 0 0 0 0 var(--bg), 0 0 0 0 var(--text);
      transition: transform var(--t-med) var(--ease-spring), box-shadow var(--t-med) var(--ease-out);
    }
    .swatch.auto { background: conic-gradient(#6FA0E8 0 25%, #4FA876 0 50%, #E8A93B 0 75%, #E8674B 0); }
    @media (hover: hover) { .swatch:hover { transform: scale(1.12); } }
    .swatch:active { transform: scale(0.92); }
    .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text); }
    .checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 4px 12px; }
    .check { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; font-size: 14px; cursor: pointer; line-height: 1.35; }
    .check input { margin-top: 2px; width: 16px; height: 16px; accent-color: var(--accent); flex-shrink: 0; }
    .hint { color: var(--text-muted); font-size: 13px; line-height: 1.5; margin-top: 10px; }
    .hint a, .setup-foot a {
      color: var(--accent);
      text-decoration-color: rgba(var(--accent-rgb), 0.4);
      text-underline-offset: 3px;
      transition: text-decoration-color var(--t-fast) ease, text-underline-offset var(--t-fast) ease;
    }
    .hint a:hover, .setup-foot a:hover { text-decoration-color: currentColor; text-underline-offset: 4px; }

    /* Card editors */
    .ce {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 4px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .ce.enter { animation-duration: 360ms; }
    .ce-top { display: flex; align-items: center; gap: 10px; }
    .ce-num {
      width: 24px; height: 24px; border-radius: 3px;
      background: var(--surface3);
      display: inline-flex; align-items: center; justify-content: center;
      font: 700 12px var(--font-mono);
      flex-shrink: 0;
    }
    .ce-stop { flex: 1; min-width: 0; }
    .ce-stop b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ce-stop small { color: var(--text-dim); font-family: var(--font-mono); font-size: 12px; }
    .ce-stop i { color: var(--text-dim); }
    .ce-tools { display: flex; gap: 4px; }
    .ce-tools .icon-btn { width: 32px; height: 32px; }
    .ce-tools .icon-btn svg { width: 16px; height: 16px; }
    .ss-wrap { position: relative; display: flex; gap: 6px; margin-top: 10px; }
    .ss-wrap .text-input { flex: 1; min-width: 0; }
    .ss-results {
      position: absolute; left: 0; right: 0; top: calc(100% + 4px);
      z-index: 10;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 4px;
      box-shadow: var(--shadow);
      max-height: 300px;
      overflow-y: auto;
      transform-origin: top center;
    }
    .ss-results:not([hidden]) { animation: drop-in var(--t-med) var(--ease-out); }
    @keyframes drop-in { from { opacity: 0; transform: translateY(-4px) scale(0.98); } }
    .ss-item {
      padding: 9px 11px; cursor: pointer; border-top: 1px solid var(--border);
      transition: background-color 120ms ease, box-shadow 120ms ease;
    }
    .ss-item:first-child { border-top: 0; }
    .ss-item:hover { background: var(--surface2); }
    .ss-item.active { background: var(--surface2); box-shadow: inset 3px 0 0 var(--accent); }
    .ss-name { display: block; font-weight: 600; }
    .ss-meta { font-size: 12px; color: var(--text-dim); font-family: var(--font-mono); }
    .ss-empty { padding: 10px 11px; color: var(--text-dim); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips .chips-note { color: var(--text-dim); font-size: 13px; }
    .chip {
      border: 1px solid var(--border2);
      background: var(--surface);
      border-radius: 3px;
      padding: 5px 9px;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex; align-items: center; gap: 6px;
      max-width: 100%;
      transition: background-color var(--t-fast) ease, border-color var(--t-fast) ease, color var(--t-fast) ease,
                  transform var(--t-fast) var(--ease-out);
    }
    @media (hover: hover) {
      .chip:hover { border-color: var(--text-muted); transform: translateY(-1px); }
      .chip[aria-pressed="true"]:hover { border-color: var(--accent); }
    }
    .chip:active { transform: scale(0.96); }
    .chip.pop { animation: chip-pop 320ms var(--ease-spring); }
    @keyframes chip-pop { 0% { transform: scale(0.9); } 60% { transform: scale(1.05); } 100% { transform: none; } }
    .chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chip .chip-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; background: var(--c, var(--surface3)); }
    .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    .chip.missing { border-style: dashed; }

    .toast {
      position: fixed;
      left: 50%; bottom: calc(var(--safe-bottom) + 24px);
      transform: translateX(-50%);
      z-index: 3000;
      background: var(--text);
      color: var(--bg);
      padding: 10px 16px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      max-width: calc(100% - 32px);
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, 12px) scale(0.97);
      transition: opacity var(--t-med) ease, transform var(--t-med) var(--ease-out), visibility 0s linear var(--t-med);
    }
    .toast.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); transition-delay: 0s; }

    /* Theme picker: each preview carries its own data-theme, so it renders in that theme's colours */
    .themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 8px; }
    .theme-tile {
      display: flex; flex-direction: column; gap: 6px;
      padding: 5px 5px 7px;
      border: 1px solid var(--border2);
      border-radius: 6px;
      background: var(--surface);
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      transition: border-color var(--t-fast) ease, box-shadow var(--t-fast) ease, transform var(--t-fast) var(--ease-out);
    }
    .theme-tile > span:last-child { padding: 0 3px; }
    @media (hover: hover) { .theme-tile:hover { transform: translateY(-2px); border-color: var(--text-muted); } }
    .theme-tile:active { transform: scale(0.97); }
    .theme-tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
    .tt-prev { display: flex; height: 54px; border-radius: 3px; overflow: hidden; }
    .tt-half { flex: 1; min-width: 0; display: flex; padding: 9px 7px; background: var(--bg); color: var(--text); }
    .tt-prev.auto .tt-half { padding: 9px 4px; }
    .tt-prev.auto .tt-num { display: none; }
    .tt-card {
      flex: 1; min-width: 0;
      display: flex; align-items: center; gap: 6px;
      padding: 0 7px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
    }
    .tt-pill { width: 16px; height: 11px; border-radius: 2px; background: var(--accent); flex-shrink: 0; }
    .tt-lines { flex: 1; min-width: 0; display: grid; gap: 4px; }
    .tt-lines i { height: 3px; border-radius: 2px; background: var(--text); opacity: 0.75; }
    .tt-lines i + i { width: 60%; opacity: 0.35; }
    .tt-num { font: 700 17px/1 var(--font-board); color: var(--text); }
    .tt-half[data-theme="signal"] .tt-num { text-shadow: 0 0 6px rgba(var(--accent-rgb), 0.6); }
    .tt-half[data-theme="ticket"] .tt-card { border: 1px dashed var(--border2); border-radius: 4px; }
    .tt-half[data-theme="receipt"] .tt-card { border: 0; border-radius: 0; }
    .tt-half[data-theme="receipt"] .tt-pill { background: none; box-shadow: inset 0 0 0 1.5px var(--text); border-radius: 0; }
    .tt-half[data-theme="platform"] .tt-card { border: 0; border-radius: 0; border-top: 3px solid var(--accent); }
    .tt-half[data-theme="platform"] .tt-pill { border-radius: 6px; }
    .tt-half[data-theme="platform"] .tt-num { color: var(--accent); }

    /* ===== Theme shapes: what a theme changes beyond its colours ===== */

    /* Ticket: punched notches + perforation under the header, torn-off bottom edge,
       a faint security pattern, and delays stamped on in ink. drop-shadow (not
       box-shadow) so the shadow follows the torn edge. */
    :root[data-theme="ticket"] .card {
      position: relative;
      border: 0;
      border-radius: 8px 8px 0 0;
      margin-bottom: 8px;
      background-image: repeating-linear-gradient(-45deg, rgba(var(--accent-rgb), 0.035) 0 1px, transparent 1px 7px);
      filter: drop-shadow(0 1px 0 rgba(74,52,28,0.25)) drop-shadow(0 8px 10px rgba(74,52,28,0.14));
    }
    :root[data-theme="ticket"] .card::after {
      content: '';
      position: absolute;
      left: 0; right: 0; top: 100%;
      height: 7px;
      background: conic-gradient(from -45deg at 50% 100%, var(--surface) 90deg, transparent 0) 0 0 / 14px 7px repeat-x;
    }
    :root[data-theme="ticket"] .card > header {
      position: relative;
      margin: -1rem -1rem 0;
      padding: 1rem 1rem 0.9rem;
      background: repeating-linear-gradient(90deg, var(--border2) 0 6px, transparent 6px 12px) left bottom / 100% 2px no-repeat;
    }
    :root[data-theme="ticket"] .card > header::before,
    :root[data-theme="ticket"] .card > header::after {
      content: '';
      position: absolute;
      bottom: -11px;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--bg);
      box-shadow: inset 0 2px 3px rgba(74,52,28,0.3);
    }
    :root[data-theme="ticket"] .card > header::before { left: -11px; clip-path: inset(0 0 0 50%); }
    :root[data-theme="ticket"] .card > header::after { right: -11px; clip-path: inset(0 50% 0 0); }
    :root[data-theme="ticket"] .card-title::before {
      content: 'Admit one · Bus';
      display: block;
      margin-bottom: 0.4rem;
      font: 600 0.62rem/1 var(--font-mono);
      letter-spacing: 0.28em;
      color: var(--accent);
    }
    :root[data-theme="ticket"] .route-pill { border-radius: 2px; }
    :root[data-theme="ticket"] .route-pill:not(.sm) {
      outline: 1.5px dashed color-mix(in srgb, currentColor 50%, transparent);
      outline-offset: -4px;
    }
    :root[data-theme="ticket"] .badge:not(.b-sched) {
      background: transparent;
      border: 1.5px solid currentColor;
      border-radius: 2px;
      padding: 0.08rem 0.35rem;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      transform: rotate(-2deg);
    }
    :root[data-theme="ticket"] .dep,
    :root[data-theme="ticket"] .then { border-top-style: dashed; border-top-color: var(--border2); }

    /* Receipt: torn zigzag top and bottom, centred header, black-only print */
    :root[data-theme="receipt"] .card {
      position: relative;
      border: 0;
      border-radius: 0;
      margin: 7px 0;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.12));
    }
    :root[data-theme="receipt"] .card::before,
    :root[data-theme="receipt"] .card::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 6px;
    }
    :root[data-theme="receipt"] .card::before { bottom: 100%; background: conic-gradient(from 135deg at 50% 0, var(--surface) 90deg, transparent 0) 0 0 / 12px 6px repeat-x; }
    :root[data-theme="receipt"] .card::after { top: 100%; background: conic-gradient(from -45deg at 50% 100%, var(--surface) 90deg, transparent 0) 0 0 / 12px 6px repeat-x; }
    :root[data-theme="receipt"] .card > header { text-align: center; padding-bottom: 0.75rem; border-bottom: 1px dashed var(--border2); }
    :root[data-theme="receipt"] .card-title { letter-spacing: 0.08em; }
    :root[data-theme="receipt"] .card-title::before {
      content: '*** Next buses ***';
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      color: var(--text-dim);
    }
    :root[data-theme="receipt"] .card-rows::after {
      content: 'Thank you for riding';
      display: block;
      margin-top: 0.5rem;
      padding-top: 0.7rem;
      border-top: 1px dashed var(--border2);
      text-align: center;
      text-transform: uppercase;
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      color: var(--text-dim);
    }
    :root[data-theme="receipt"] .route-pill {
      background: transparent !important;
      color: var(--text) !important;
      box-shadow: inset 0 0 0 1.5px var(--text);
      border-radius: 0;
      font-weight: 600;
    }
    :root[data-theme="receipt"] .cd b { font-weight: 600; }
    :root[data-theme="receipt"] .badge:not(.b-sched) { background: transparent; padding: 0; }
    :root[data-theme="receipt"] .badge:not(.b-sched)::before { content: '['; }
    :root[data-theme="receipt"] .badge:not(.b-sched)::after { content: ']'; }
    :root[data-theme="receipt"] .then-item { background: transparent; box-shadow: inset 0 0 0 1px var(--border2); }
    :root[data-theme="receipt"] .dep,
    :root[data-theme="receipt"] .then { border-top-style: dashed; border-top-color: var(--border2); }

    /* Platform: station sign — header bar, yellow top rule, round route bullets,
       zebra rows, yellow countdowns */
    :root[data-theme="platform"] .top { background: var(--surface); border-bottom: 1px solid var(--border); margin-bottom: 0.75rem; }
    :root[data-theme="platform"] .top-title,
    :root[data-theme="platform"] .card-title { text-transform: none; letter-spacing: -0.01em; }
    :root[data-theme="platform"] .card-title { font-size: 1.3rem; }
    :root[data-theme="platform"] .card { border: 0; border-radius: 0; border-top: 0.3rem solid var(--accent); }
    :root[data-theme="platform"] .dep { margin: 0 -1rem; padding-left: 1rem; padding-right: 1rem; border-top: 0; }
    :root[data-theme="platform"] .dep:nth-child(even) { background: rgba(255,255,255,0.045); }
    :root[data-theme="platform"] .route-pill { border-radius: 999px; }
    :root[data-theme="platform"] .route-pill:not(.sm) { min-width: 3.3rem; padding: 0.45rem 0.65rem; }
    :root[data-theme="platform"] .cd b { color: var(--accent); }

    @media (max-width: 600px) {
      .setup-sheet { border-left: 0; }
      .top-clock { font-size: 1.5rem; }
      .hero .cd b { font-size: 4rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .live-dot.ok, .vi-ico, .map-veh::after, .ss-near.busy svg { animation: none; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0s !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        transition-delay: 0s !important;
      }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-text">
      <div class="top-title" id="boardTitle">At a glance</div>

    <div class="top-actions">

          <g class="fs-enter"><path class="c-tl" d="M8 3H5a2 2 0 0 0-2 2v3"/><path class="c-tr" d="M21 8V5a2 2 0 0 0-2-2h-3"/><path class="c-bl" d="M3 16v3a2 2 0 0 0 2 2h3"/><path class="c-br" d="M16 21h3a2 2 0 0 0 2-2v-3"/></g>
          <g class="fs-exit"><path class="c-tl" d="M8 3v3a2 2 0 0 1-2 2H3"/><path class="c-tr" d="M21 8h-3a2 2 0 0 1-2-2V3"/><path class="c-bl" d="M3 16h3a2 2 0 0 1 2 2v3"/><path class="c-br" d="M16 21v-3a2 2 0 0 1 2-2h3"/></g>
        </svg>
      </button>
      <button class="icon-btn" id="editBtn" type="button" title="Edit board" aria-label="Edit board">
        <svg class="ico-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <main class="cards" id="cards"></main>

  <div class="setup" id="setup" role="dialog" aria-modal="true" aria-labelledby="setupTitle" hidden>
    <div class="setup-sheet">
      <div class="setup-head">
        <h2 id="setupTitle">Board setup</h2>
        <button class="icon-btn" id="setupClose" type="button" aria-label="Close">
          <svg class="ico-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="setup-body">
        <section class="sg">
          <h3>Stops</h3>
          <div id="cardEditors"></div>
          <button class="btn" id="addCard" type="button"><svg class="ico-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add a stop</button>
        </section>
        <section class="sg">
          <h3>Show</h3>
          <div class="checks" id="showChecks"></div>
          <label class="field"><span>Departures per stop</span><select id="fCount"></select></label>
        </section>
        <section class="sg">
          <h3>Look</h3>
          <label class="field"><span>Board name <small>(optional)</small></span><input class="text-input" id="fTitle" type="text" placeholder="e.g. Morning commute" maxlength="60" /></label>
          <div class="field"><span>Theme</span><div class="themes" id="fTheme"></div></div>
          <div class="field"><span>Accent colour</span><div class="swatches" id="fAccent"></div></div>
          <div class="field"><span>Text size</span><div class="seg" id="fSize"></div></div>
          <div class="field"><span>Layout</span><div class="seg" id="fLayout"></div></div>
        </section>
        <section class="sg">
          <h3>This screen</h3>
          <label class="check"><input type="checkbox" id="fWake" /><span>Keep the screen on <small id="wakeNote">(for kiosks and wall displays)</small></span></label>
          <p class="hint">On iPhone, save the board, then tap Share → <b>Add to Home Screen</b>. The setup is stored in the link, so each home-screen icon or bookmark keeps its own board. <a href="#new" id="newBoard">Start another board</a></p>
        </section>
