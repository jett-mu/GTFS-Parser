      const periods = al.active_period || [];
      return !periods.length || periods.some(p => (!p.start || Number(p.start) <= now) && (!p.end || Number(p.end) >= now));
    }
    // Active alerts for a board route (and, when given, one of its trips).
    function alertsFor(routeId, tripId) {
      if (!alerts.length) return [];
      const keys = new Set([normRoute(routeId)]);
      if (realRouteIds.has(routeId)) keys.add(normRoute(realRouteIds.get(routeId)));
      const now = Date.now() / 1000;
      return alerts.filter(a => a.alert && alertActive(a.alert, now) && (a.alert.informed_entity || []).some(ie => {
        if (ie.trip && ie.trip.trip_id) return !!tripId && ie.trip.trip_id === tripId;
        if (ie.stop_id != null) return false; // stop-level alerts aren't matched to a route card
        const r = ie.route_id != null ? ie.route_id : ie.trip && ie.trip.route_id;
        return r != null && keys.has(normRoute(r));
      }));
    }
    function alertId(a) { return String(a.id != null ? a.id : alertText(a.alert.header_text)); }
    // routes: board route ids to show as bullets (the board box); without them, a warning icon.
    function alertHTML(a, routes) {
      const al = a.alert, id = alertId(a);
      const head = alertText(al.header_text) || 'Service alert';
      const body = alertText(al.description_text);
      const lead = routes && routes.length
        ? `<span class="alert-routes">${routes.map(r => `<span class="flt-bullet" style="${routeStyle(routeColors.get(r))}">${escapeHtml(r)}</span>`).join('')}</span>`
        : warnIcon('alerts-ico');
      return `<details class="alert-item" data-alert="${escapeHtml(id)}"${openAlerts.has(id) ? ' open' : ''}><summary>${lead}<span>${escapeHtml(head)}</span>${ICON_CHEV}</summary>${body ? `<p>${escapeHtml(body)}</p>` : ''}</details>`;
    }

    // The box above the board: every active alert touching a route on it.
    function renderAlerts() {
      const box = byId('alertBox');
      const found = new Map(); // alert id -> {a, routes[]}
      [...routeColors.keys()].sort(routeCmp).forEach(r => alertsFor(r).forEach(a => {
        const id = alertId(a);
        if (!found.has(id)) found.set(id, { a, routes: [] });
        found.get(id).routes.push(r);
      }));
      const list = [...found.values()];
      const key = list.map(x => alertId(x.a) + ':' + x.routes.join('|')).join(',');
      if (box.dataset.key !== key) {
        box.dataset.key = key;
        box.hidden = !list.length;
        box.innerHTML = list.length
          ? `<summary>${warnIcon('alerts-ico')}<span class="alerts-count">${plural(list.length, 'service alert')} on these routes</span>${ICON_CHEV}</summary>${list.map(x => alertHTML(x.a, x.routes)).join('')}`
          : '';
        box.open = list.length > 0 && openAlerts.has('board');
        clampPos();
      }
      applyCardMarks();
    }
    // Pinned / alert marks in each route card's head (cards are only rebuilt when the route set changes).
    function applyCardMarks() {
      document.querySelectorAll('#board .rcard').forEach(c => {
        const pin = c.querySelector('.rcard-pin'), flag = c.querySelector('.rcard-flag');
        if (pin) pin.hidden = !pinned.has(c.dataset.route);
        if (flag) flag.hidden = !alertsFor(c.dataset.route).length;
      });
    }
    // <details> toggle doesn't bubble: capture it to remember what's open and re-clamp the sheet.
    byId('scroller').addEventListener('toggle', e => {
      const id = e.target && e.target.dataset && e.target.dataset.alert;
      if (!id) return;
      if (e.target.open) openAlerts.add(id); else openAlerts.delete(id);
      clampPos();
    }, true);

    const renderAlertsSoon = debounce(() => { renderAlerts(); if (inDetail()) renderDetail(); }, 150);
    // One /api/trip per board route that hasn't told us its feed route_id yet (cached).
    function ensureRouteIds() {
      if (!alerts.length) return;
      const seen = new Set();
      allDeps.forEach(d => {
        if (seen.has(d.route_id)) return;
        seen.add(d.route_id);
        if (realRouteIds.has(d.route_id)) return;
        fetchTripJson(d.trip_id).then(t => {
          if (!t || !t.route_id) return;
          realRouteIds.set(d.route_id, String(t.route_id));
          renderAlertsSoon();
        });
      });
    }
    // Every ALERTS_MS at most (force: the refresh button).
    function loadAlerts(force) {
      if (!force && Date.now() - alertsAt < ALERTS_MS) return Promise.resolve();
      alertsAt = Date.now();
      return apiFetch('/api/rt/alerts')
        .then(r => r.ok ? r.json() : []) // 422 = no alerts right now
        .then(d => {
          alerts = Array.isArray(d) ? d : (d && d.entity) || [];
          ensureRouteIds();
          renderAlertsSoon();
        })
        .catch(() => {});
    }

    // ===== FIRST-RUN TIP + PINNED ROUTES =====
    const TIP_KEY = 'gtfs-phone-tip-seen';
    function syncTip() { byId('tip').hidden = lsGet(TIP_KEY, false) === true || !allDeps.length; }
    function dismissTip() {
      if (lsGet(TIP_KEY, false) === true) return;
      lsSet(TIP_KEY, true);
      syncTip();
    }
    byId('tipClose').addEventListener('click', () => { dismissTip(); clampPos(); });

    function togglePin(routeId) {
      if (pinned.has(routeId)) pinned.delete(routeId); else pinned.add(routeId);
      lsSet(PIN_KEY, [...pinned]);
      renderBoard(); // re-sorts the cards and, through renderDetail, the header's pin button
    }
    byId('pinBtn').addEventListener('click', () => { if (view.dep) togglePin(view.dep.route_id); });

    // ===== DETAIL VIEWS: a trip, a route or a stop inside the departures sheet =====
    // view.type: 'board' | 'trip' {dep} | 'route' {dep, routeId} | 'stop' {stopId}. Opening
    // one hides the board (which keeps refreshing underneath) and puts the same thing on
    // the map. Back (the header button, Esc, or the phone's own back gesture through a
    // history entry per level) pops to the previous view; from the first one it returns
    // to the board where it was left and re-centres the map on the rider.
    const detailEl = byId('detail');
    const ROUTE_VIEW_DEPS = 6;  // per direction before "Show all"
    const STOP_VIEW_DEPS = 60;
    const DEST_KEY = 'gtfs-phone-dest'; // `${route}|${headsign}` -> stop_id the rider gets off at
    function viewDepth() { return inDetail() ? viewStack.length + 1 : 0; }
    function stopData(id) { return lastStopDatas.find(s => String(s.stop_id) === String(id)); }

    function setView(next) {
      const before = viewDepth();
      if (!inDetail()) boardReturn = isWide() ? { scrollTop: scroller.scrollTop } : { pos };
      else if (!(view.type === 'stop' && next.type === 'stop')) viewStack.push(view); // stop -> stop just swaps
      view = next;
      document.body.classList.add('in-detail');
      detailEl.hidden = false;
      if (viewDepth() > before) { try { history.pushState({ pd: viewDepth() }, ''); } catch (e) {} }
      renderDetail(true);
      resetListScroll();
    }
    function openTrip(dep) {
      if (view.type === 'trip' && depKey(view.dep) === depKey(dep)) return;
      dismissTip();
      setView({ type: 'trip', dep, showEarlier: false, dest: null });
      showTrip(dep);
    }
    function openRoute(dep) {
      if (view.type === 'route' && view.routeId === dep.route_id) return;
      setView({ type: 'route', dep, routeId: dep.route_id, expanded: new Set() });
      showRoute(dep);
    }
    function openStop(stopId) {
      if (!stopData(stopId) || (view.type === 'stop' && view.stopId === String(stopId))) return;
      setView({ type: 'stop', stopId: String(stopId) });
      clearOverlay();
      setFocusedStop(stopId);
    }

    // Back one level. A history entry was pushed per level, so go through history when
    // ours is on top (keeps the system back gesture and the button in step).
    let backPending = false; // history.back() lands a moment later; don't send a second one meanwhile
    function goBack() {
      if (!inDetail() || backPending) return;
      if (history.state && history.state.pd === viewDepth()) {
        backPending = true;
        setTimeout(() => { backPending = false; }, 600);
        history.back();
      } else popView();
    }
    function popView() {
      if (!inDetail()) return;
      const prev = viewStack.pop();
      if (!prev) { exitToBoard(); return; }
      view = prev;
      if (view.type === 'trip') showTrip(view.dep);
      else if (view.type === 'route') showRoute(view.dep);
      else { clearOverlay(); setFocusedStop(view.stopId); }
      renderDetail(true);
      resetListScroll();
    }
    // unwind: also drop our history entries (a location change, not a Back).
    // restore: false leaves the sheet and map where they are.
    function exitToBoard(opts = {}) {
      const depth = viewDepth();
      viewStack.length = 0;
      view = { type: 'board' };
      document.body.classList.remove('in-detail');
      detailEl.hidden = true;
      detailEl.replaceChildren();
      syncHead();
      clearOverlay();
      setFocusedStop(null);
      if (!depth) return;
      if (opts.unwind) { try { if (history.state && history.state.pd) history.go(-Math.min(depth, history.state.pd)); } catch (e) {} }
      if (opts.restore === false) return;
      stopMomentum();
      if (isWide()) scroller.scrollTop = (boardReturn && boardReturn.scrollTop) || 0;
      else if (boardReturn && boardReturn.pos != null) { setPos(boardReturn.pos); savePos(); }
      setFollow(true);
      centerOnLocation(true);
    }
    window.addEventListener('popstate', () => {
      backPending = false;
      const target = (history.state && history.state.pd) || 0;
      while (viewDepth() > target) popView();
    });
    byId('backBtn').addEventListener('click', goBack);

    // The sheet header: location button on the board; Back + what's open in a detail view.
    function syncHead() {
      const d = inDetail();
      byId('backBtn').hidden = !d;
      byId('locHeaderBtn').hidden = d;
      byId('dh').hidden = !d;
      byId('displayBtn').hidden = d;
      const pinBtn = byId('pinBtn');
      pinBtn.hidden = !d || view.type === 'stop';
      if (!d) return;
      const bullet = byId('dhRoute'), title = byId('dhTitle'), sub = byId('dhSub');
      if (view.type === 'stop') {
        const sd = stopData(view.stopId);
        bullet.hidden = true;
        title.textContent = (sd && (sd._stopName || sd.stop_name)) || `Stop ${view.stopId}`;
        sub.textContent = sd ? `Stop ${sd._stopCode || sd.stop_id} · ${fmtWalk(sd._distanceKM || 0)}` : '';
        return;
      }
      const dep = view.dep;
      bullet.hidden = false;
      bullet.textContent = dep.route_id;
      bullet.setAttribute('style', routeStyle(dep.route_color));
      if (view.type === 'trip') {
        title.textContent = dep.trip_headsign || `Route ${dep.route_id}`;
        sub.textContent = (tripView && tripView.dep === dep && tripView.trip.route_long_name) || '';
      } else {
        title.textContent = (view.info && view.info.route_long_name) || `Route ${dep.route_id}`;
        sub.textContent = !view.info ? '' : view.info.all_days ? 'No trips today' : `${plural(view.info.trips || 0, 'trip')} today`;
      }
      const on = pinned.has(dep.route_id);
      pinBtn.setAttribute('aria-pressed', String(on));
      pinBtn.setAttribute('aria-label', on ? `Unpin route ${dep.route_id}` : `Pin route ${dep.route_id} to the top of the board`);
    }

    // fresh: the view just opened (or came back off the stack): rebuild it from scratch.
    // Otherwise each view only rebuilds what changed, so this is safe to call every tick.
    function renderDetail(fresh) {
      if (!inDetail()) return;
      if (fresh) { view.built = false; view.key = null; detailEl.className = 'pd-list dv dv-' + view.type; scheduleDeclutter(); }
      if (view.type === 'trip') renderTripView();
      else if (view.type === 'route') renderRouteView();
      else renderStopView();
      syncHead();
      updateETAs();
      lastStopDatas.forEach(s => reapplyCachedRT(s.stop_id));
      applyCardBuses();
      clampPos();
    }

    function fillDetailAlerts(list) {
      const box = detailEl.querySelector('.dv-alerts');
      if (!box) return;
      const key = list.map(alertId).join(',');
      if (box.dataset.key === key) return;
      box.dataset.key = key;
      box.className = 'dv-alerts' + (list.length ? ' alerts' : '');
      box.innerHTML = list.map(a => alertHTML(a)).join('');
    }
    const ICON_WALK = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 3 3 10.5l7.2 2.3L12.5 20z"/></svg>';
    const ICON_ROUTE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 17V9a3 3 0 0 1 6 0v6a3 3 0 0 0 6 0V7"/><path d="M4 17h4v4H4zM16 3h4v4h-4z"/></svg>';
    // Walking directions in the phone's own maps app.
    function directionsLink(lat, lon) {
      if (!isFinite(lat) || !isFinite(lon)) return '';
      const apple = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
      const href = apple
        ? `https://maps.apple.com/?daddr=${lat},${lon}&dirflg=w`
        : `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}&travelmode=walking`;
      return `<a class="dv-btn" href="${href}" target="_blank" rel="noopener">${ICON_WALK}Directions to stop</a>`;
    }
    function detailNote(text) {
      const n = document.createElement('div');
      n.className = 'dv-note';
      n.textContent = text;
      return n;
    }

    // --- Trip: the departure you tapped (same pane as its route card), then every stop ---
    function renderTripView() {
      const dep = view.dep;
      if (!view.built) {
        view.built = true;
        const rs = routeStyle(dep.route_color);
        const sd = stopData(dep._stopId);
        detailEl.innerHTML = `
          <div class="dv-alerts"></div>
          <article class="rcard tv-hero${rs ? ' has-rc' : ''}" style="${rs}">
            <section class="rpane"><div class="dep-card rpane-main">${metaHTML(dep)}${statusHTML(dep)}${LEAVE_HTML}<div class="row-bus" hidden></div></div></section>
          </article>
          <div class="dv-actions">${sd ? directionsLink(sd._lat, sd._lon) : ''}<button type="button" class="dv-btn" data-act="route">${ICON_ROUTE}Whole route</button></div>
          <div class="tl" id="tl" style="${rs}"></div>`;
        detailEl.appendChild(footnote());
        setDepAttrs(detailEl.querySelector('.dep-card'), dep);
      }
      fillDetailAlerts(alertsFor(dep.route_id, dep.trip_id));
      renderTimeline();
    }

    // Seconds on today's clock for a stop of the shown trip (its service day may be
    // yesterday's or tomorrow's).
    function tripClock(v, s) { return parseTime(s.time) + (v.dep.next_day ? 86400 : v.dep.prev_day ? -86400 : 0); }
    function dayClock(secs) { return ((secs % 86400) + 86400) % 86400; }
    function destKey(dep) { return `${dep.route_id}|${dep.trip_headsign || ''}`; }

    const fareFormats = new Map();
    function fmtFare(price, currency) {
      if (!fareFormats.has(currency)) {
        let f = null;
        try { f = new Intl.NumberFormat(undefined, { style: 'currency', currency }); } catch (e) {}
        fareFormats.set(currency, f);
      }
      const f = fareFormats.get(currency);
      return f ? f.format(price) : `${(+price).toFixed(2)} ${currency}`;
    }
    // Fares from the boarding stop to every later stop, once the rider picks where they get off.
    function ensureFares(v) {
      if (view.fares !== undefined || v.bi < 0) return;
      view.fares = null;
      const cur = view, b = v.stops[v.bi];
      apiFetch(`/api/tripfares/${encodeURIComponent(v.trip.trip_id)}/${encodeURIComponent(b.id)}?seq=${+b.stop_sequence}`)
        .then(r => r.ok ? r.json() : null)
        .then(d => {
          if (!d || !d.fares_available) return;
          cur.fares = new Map((d.fares || []).filter(f => f.fare).map(f => [+f.stop_sequence, f.fare]));
          if (view === cur) renderTimeline();
        })
        .catch(() => {});
    }

    function tlTimeHTML(v, i) {
      const s = v.stops[i];
      if (!s.time) return '';
      const sched = tripClock(v, s), d = v.delays[i];
      const txt = fmtClockShort(dayClock(sched));
      const mins = d == null ? 0 : Math.round(d / 60);
      if (!mins) return txt;
      return `<s>${txt}</s><span class="${mins > 0 ? 'late' : 'early'}">${fmtClockShort(dayClock(sched + d))}</span>`;
    }
    function destText(v, i) {
      const parts = ['Get off here'];
      if (v.bi >= 0 && v.stops[i].time && v.stops[v.bi].time) {
        const ride = Math.max(1, Math.round((tripClock(v, v.stops[i]) - tripClock(v, v.stops[v.bi])) / 60));
        parts.push(`${ride} min ride`);
      }
      const fare = view.fares && view.fares.get(+v.stops[i].stop_sequence);
      if (fare) parts.push(fmtFare(fare.price, fare.currency));
      return parts.join(' · ');
    }

    function timelineHTML(v) {
      const n = v.stops.length, bi = v.bi, bus = v.busAt, now = nowInSeconds();
      // The stop the rider last chose for this route + direction comes back selected.
      if (!view.destInit) {
        view.destInit = true;
        const saved = (lsGet(DEST_KEY, {}) || {})[destKey(v.dep)];
        const i = saved != null && bi >= 0 ? v.stops.findIndex((s, k) => k > bi && String(s.id) === String(saved)) : -1;
        if (i > 0) { view.dest = i; ensureFares(v); markDest(v); }
      }
      // Behind the bus when one is reporting, otherwise by the (realtime-adjusted) clock.
      const passed = i => bus ? i < bus.i : !!v.stops[i].time && tripClock(v, v.stops[i]) + (v.delays[i] || 0) < now - 30;
      const from = !view.showEarlier && bi > 1 ? bi : 0;
      let out = '';
      if (from > 0) {
        out += `<button type="button" class="tl-row tl-expand passed"><span class="tl-time"></span><span class="tl-rail"></span><span class="tl-name">Show ${plural(from, 'earlier stop')}${bus && bus.i < from ? ' and the bus' : ''}</span></button>`;
      }
      for (let i = from; i < n; i++) {
        const s = v.stops[i];
        if (bus && bus.i === i && bus.status !== 'stopped') {
          out += `<button type="button" class="tl-row tl-busrow"><span class="tl-time"></span><span class="tl-rail"></span><span class="tl-name">Bus is here</span></button>`;
        }
        const cls = ['tl-row'];
        if (passed(i)) cls.push('passed');
        if (i === bi) cls.push('is-board');
        if (i === view.dest) cls.push('is-dest');
        if (i === 0) cls.push('is-first');
        if (i === n - 1) cls.push('is-last');
        const tags = [];
        if (bus && bus.i === i && bus.status === 'stopped') tags.push('Bus is here');
        if (i === bi) tags.push('Your stop');
        if (i === view.dest) tags.push(destText(v, i));
        const note = i > 0 && i < n - 1 && i >= bi ? pickupDropoffNote(s) : '';
        const tagHTML = tags.length || note ? `<span class="tl-tag">${escapeHtml(tags.join(' · '))}${tags.length && note ? ' ' : ''}${note}</span>` : '';
        out += `<button type="button" class="${cls.join(' ')}" data-i="${i}"${i > bi && bi >= 0 ? ` aria-pressed="${i === view.dest}"` : ''}><span class="tl-time">${tlTimeHTML(v, i)}</span><span class="tl-rail"></span><span class="tl-name">${escapeHtml(s.name)}${tagHTML}</span></button>`;
      }
      return out;
    }
    function renderTimeline() {
      if (view.type !== 'trip') return;
      const box = byId('tl');
      if (!box) return;
      const v = tripView;
      const html = view.failed ? '<div class="dv-note">Couldn’t load this trip’s stops. Go back and try again.</div>'
        : !v || v.dep !== view.dep ? '<div class="tl-skel"></div>'.repeat(4)
        : timelineHTML(v);
      if (box._html === html) return;
      box._html = html;
      box.innerHTML = html;
      clampPos();
    }

    // Centre a point in the part of the map the sheet doesn't cover, at street level.
    function showOnMap(latlng) {
      const z = Math.max(map.getZoom(), 15);
      const offset = followPoint().subtract(map.getSize().divideBy(2));
      map.setView(map.unproject(map.project(latlng, z).subtract(offset), z), z, { animate: !reduceMotion() });
    }
    function focusTripStop(v, i) {
      if (!map) return;
      const m = i === v.bi ? stopMarkers.get(v.boardStopId) : v.markers.find(x => x._i === i);
      if (!m) return;
      setFollow(false);
      if (m !== stopMarkers.get(v.boardStopId)) { lineFocus = m; declutter(); }
      m.openPopup();
      showOnMap(m.getLatLng());
    }

    detailEl.addEventListener('click', e => {
      const act = e.target.closest('[data-act]');
      if (act) {
        if (act.dataset.act === 'route' && view.dep) openRoute(view.dep);
        else if (act.dataset.act === 'more' && view.type === 'route') { view.expanded.add(act.dataset.hs || ''); renderDetail(); }
        return;
      }
      const row = e.target.closest('.tl-row');
      const v = tripView;
      if (!row || view.type !== 'trip' || !v || v.dep !== view.dep) return;
      if (row.classList.contains('tl-expand')) { view.showEarlier = true; renderTimeline(); return; }
      if (row.classList.contains('tl-busrow')) {
        if (bus && map) { setFollow(false); bus.marker.openPopup(); showOnMap(bus.marker.getLatLng()); }
        return;
      }
      const i = +row.dataset.i;
      // A stop after yours: mark (or unmark) it as where you get off, remembered per route + direction.
      if (v.bi >= 0 && i > v.bi) {
        view.dest = view.dest === i ? null : i;
        const saved = lsGet(DEST_KEY, {}) || {};
        if (view.dest == null) delete saved[destKey(v.dep)]; else saved[destKey(v.dep)] = String(v.stops[i].id);
        lsSet(DEST_KEY, saved);
        if (view.dest != null) ensureFares(v);
        markDest(v);
        renderTimeline();
      }
      focusTripStop(v, i);
    });

    // --- Route: today's remaining departures from the stops around you, by direction ---
    function buildSlimRow(dep) {
      const row = document.createElement('article');
      row.className = 'dep-card row row-slim';
      setDepAttrs(row, dep);
      row.innerHTML = `<div class="row-dest">${escapeHtml(dep._stopName || 'Stop ' + dep._stopId)}</div>
        <div class="row-meta"><span class="row-stop"><span class="row-walk">${fmtWalk(dep._distanceKM)}</span></span>${pickupDropoffNote(dep)}<span class="row-miss"> · can’t make it</span></div>${statusHTML(dep)}${LEAVE_HTML}`;
      return row;
    }
    function renderRouteView() {
      const r = view.routeId;
      const groups = new Map(); // headsign -> departures, soonest first
      upcoming().forEach(d => {
        if (d.route_id !== r) return;
        const k = d.trip_headsign || '';
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push(d);
      });
      const list = [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0]))
        .map(([hs, deps]) => ({ hs, total: deps.length, deps: view.expanded.has(hs) ? deps : deps.slice(0, ROUTE_VIEW_DEPS) }));
      const key = list.map(g => `${g.hs}:${g.total}:${g.deps.map(depKey).join(',')}`).join(';');
      if (!view.built || view.key !== key) {
        view.built = true;
        view.key = key;
        const frag = document.createDocumentFragment();
        const al = document.createElement('div');
        al.className = 'dv-alerts';
        frag.appendChild(al);
        list.forEach(g => {
          const h = document.createElement('h2');
          h.className = 'dv-section';
          h.textContent = g.hs || `Route ${r}`;
          frag.appendChild(h);
          g.deps.forEach(d => frag.appendChild(buildSlimRow(d)));
          if (g.total > g.deps.length) {
            const more = document.createElement('button');
            more.type = 'button';
            more.className = 'dv-more';
            more.dataset.act = 'more';
            more.dataset.hs = g.hs;
            more.textContent = `Show all ${g.total} departures`;
            frag.appendChild(more);
          }
        });
        if (!list.length) frag.appendChild(detailNote('No more departures on this route from the stops around you today.'));
        frag.appendChild(footnote());
        detailEl.replaceChildren(frag);
      }
      fillDetailAlerts(alertsFor(r));
    }

    // --- Stop: everything still leaving from one stop of the board ---
    function renderStopView() {
      const sd = stopData(view.stopId);
      const now = nowInSeconds();
      const deps = !sd ? [] : (sd.departures || [])
        .map(d => ({ ...d, _stopId: sd.stop_id, _stopName: sd._stopName, _distanceKM: sd._distanceKM }))
        .filter(d => stillHere(d, now))
        .sort((a, b) => realTime(a) - realTime(b))
        .slice(0, STOP_VIEW_DEPS);
      const key = (sd ? 's:' : 'x:') + deps.map(depKey).join(',');
      if (view.built && view.key === key) return;
      view.built = true;
      view.key = key;
      const frag = document.createDocumentFragment();
      if (sd) {
        const actions = document.createElement('div');
        actions.className = 'dv-actions';
        actions.innerHTML = directionsLink(sd._lat, sd._lon);
        frag.appendChild(actions);
      }
      deps.forEach((d, i) => frag.appendChild(buildRow(d, i === 0)));
      if (!deps.length) frag.appendChild(detailNote(sd ? 'No more departures from this stop today.' : 'This stop is no longer near your location.'));
      frag.appendChild(footnote());
      detailEl.replaceChildren(frag);
      fitDestTexts();
    }

    window.addEventListener('online', () => { renderHeaderSub(); loadLocation().then(rtTick); });
    window.addEventListener('offline', renderHeaderSub);

    // ===== Start =====
    // env() can't be read from JS directly; mirror the safe-area insets into px custom properties.
    (function measureSafeArea() {
      const probe = document.createElement('div');
      probe.style.cssText = 'position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)';
      document.body.appendChild(probe);
      const cs = getComputedStyle(probe);
      document.documentElement.style.setProperty('--safe-top-px', cs.paddingTop);
      document.documentElement.style.setProperty('--safe-bottom-px', cs.paddingBottom);
      probe.remove();
    })();
    (function restoreSheet() {
      if (isWide()) return;
      const T = sheetTravel();
      const saved = lsGet(POS_KEY, null);
      // default: sheet covers about half the screen
      const f = isFinite(saved) && saved !== null ? saved : (window.innerHeight * 0.5 - headHeight() - safeBottomPx()) / Math.max(1, T);
      setPos(Math.max(0, Math.min(1, f)) * T);
    })();
    initMap();
    setFollow(true);
    // Always opens on live GPS; a picked/saved location only lasts until the page is reopened.
    try { localStorage.removeItem('gtfs-phone-filter'); } catch (e) {} // filtering was removed; drop any saved selection
    try { if (history.state && history.state.pd) history.replaceState(null, ''); } catch (e) {} // detail-view entries from before a reload
    refreshLocPanel();
    showSkeleton();
    secondTick();
    startGeoWatch();
    loadLocation().then(rtTick);
    startTimers();
  </script>
</body>
</html>
