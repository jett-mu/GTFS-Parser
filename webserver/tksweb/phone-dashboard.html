        const k = d.route_id + '|' + (d.trip_headsign || '');
        perDir.set(k, (perDir.get(k) || 0) + 1);
        return perDir.get(k) <= NEXT_DAY_LIST_MAX;
      });
      const [soon, later] = splitLater(deps);
      // Rebuild only when the trips on screen (or their order) change; otherwise just relabel.
      const key = 't:' + soon.map(depKey).join(',') + '/' + later.map(depKey).join(',');
      if (board.dataset.key === key) return;
      board.dataset.key = key;
      const frag = document.createDocumentFragment();
      soon.forEach((d, i) => frag.appendChild(buildRow(d, i === 0)));
      if (later.length) {
        frag.appendChild(laterHeading());
        later.forEach((d, i) => frag.appendChild(buildRow(d, !soon.length && i === 0)));
      }
      frag.appendChild(footnote());
      board.replaceChildren(frag);
      fitDestTexts();
    }

    // --- Route board: one card per route, swipe between its headsigns ---
    const PANE_DEPS = 3;
    const routeCmp = (a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
    function routeGroups(deps) {
      const m = new Map();
      deps.forEach(d => {
        if (!m.has(d.route_id)) m.set(d.route_id, new Map());
        const hs = m.get(d.route_id), k = d.trip_headsign || '';
        if (!hs.has(k)) hs.set(k, []);
        if (hs.get(k).length < PANE_DEPS) hs.get(k).push(d);
      });
      // Pinned routes first, then by route number.
      return [...m.entries()].sort((a, b) => (pinned.has(b[0]) - pinned.has(a[0])) || routeCmp(a[0], b[0])).map(([r, hs]) => ({
        r,
        color: routeColors.get(r) || '',
        panes: [...hs.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([h, list]) => ({ hs: h, deps: list })),
      }));
    }

    function renderRoutes(board, deps) {
      const [soon, later] = splitLater(deps);
      const soonGroups = routeGroups(soon), laterGroups = routeGroups(later);
      const groups = soonGroups.concat(laterGroups);
      // Cards are rebuilt only when the set of routes/headsigns changes, so a swipe
      // position survives the 15 s refresh; departures inside a pane update in place.
      const gKey = gs => gs.map(g => g.r + ':' + g.panes.map(p => p.hs).join('|')).join(',');
      const key = 'r:' + gKey(soonGroups) + '/' + gKey(laterGroups) + '/' + laterHours;
      if (board.dataset.key !== key) {
        board.dataset.key = key;
        const frag = document.createDocumentFragment();
        soonGroups.forEach(g => frag.appendChild(buildRouteCard(g)));
        if (laterGroups.length) {
          frag.appendChild(laterHeading());
          laterGroups.forEach(g => frag.appendChild(buildRouteCard(g)));
        }
        frag.appendChild(footnote());
        board.replaceChildren(frag);
        board.querySelectorAll('.rcard').forEach(card => goToPane(card, card._idx, false));
        fitDestTexts();
      }
      const cards = board.querySelectorAll('.rcard');
      groups.forEach((g, gi) => {
        const panes = cards[gi].querySelectorAll('.rpane');
        g.panes.forEach((p, i) => fillPane(panes[i], p));
      });
    }

    function buildRouteCard(g) {
      const card = document.createElement('article');
      const rs = routeStyle(g.color);
      card.className = 'rcard' + (rs ? ' has-rc' : '');
      if (rs) card.setAttribute('style', rs);
      card.dataset.route = g.r;
      card._panes = g.panes.map(p => p.hs);
      card._idx = Math.max(0, card._panes.indexOf(paneChoice[g.r]));
      const multi = g.panes.length > 1;
      card.innerHTML = `
        <div class="rcard-head">
          <span class="row-route" style="${routeStyle(g.color)}">${escapeHtml(g.r)}</span>
          <span class="rcard-hint"><span class="rcard-pin" hidden>${ICON_STAR}Pinned</span>${multi ? `<span>${g.panes.length} directions</span>` : ''}<span class="rcard-flag" hidden>${warnIcon()}Alert</span></span>
          ${multi ? `<div class="rcard-nav">
            <button type="button" class="rcard-arrow" data-step="-1" aria-label="Previous direction">&#x2039;&#xFE0E;</button>
            <div class="rcard-dots">${g.panes.map((p, i) => `<button type="button" class="rcard-dot" data-i="${i}" aria-label="${escapeHtml(p.hs || g.r)}"></button>`).join('')}</div>
            <button type="button" class="rcard-arrow" data-step="1" aria-label="Next direction">&#x203A;&#xFE0E;</button>
          </div>` : ''}
        </div>
        <div class="rcard-swiper"${multi ? ' tabindex="0" aria-roledescription="carousel"' : ''}>
          <div class="rcard-track">
          ${g.panes.map(p => `<section class="rpane" aria-label="${escapeHtml(p.hs || g.r)}">
            <div class="row-dest rpane-hs" data-full-dest="${escapeHtml(p.hs || g.r)}"></div>
            <div class="rpane-body"></div>
          </section>`).join('')}
          </div>
        </div>`;
      if (multi) {
        const sw = card.querySelector('.rcard-swiper');
        initCarouselSwipe(card, sw);
        sw.addEventListener('keydown', e => {
          if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); goToPane(card, card._idx + (e.key === 'ArrowRight' ? 1 : -1), true); }
        });
        card.querySelectorAll('.rcard-dot').forEach(b => b.addEventListener('click', () => goToPane(card, +b.dataset.i, true)));
        card.querySelectorAll('.rcard-arrow').forEach(b => b.addEventListener('click', () => goToPane(card, card._idx + +b.dataset.step, true)));
      }
      setDots(card);
      return card;
    }

    // Move the track to pane i. ms = snap duration (0 = jump); dots + saved choice update at once.
    function goToPane(card, i, smooth, ms = 130) {
      const track = card.querySelector('.rcard-track');
      i = Math.max(0, Math.min(card._panes.length - 1, i));
      const animate = smooth && !reduceMotion();
      track.classList.toggle('snapping', animate);
      if (animate) track.style.setProperty('--snap-ms', Math.round(ms) + 'ms');
      track.style.setProperty('--idx', i);
      track.style.setProperty('--dx', '0px');
      if (i !== card._idx && card._panes.length > 1) {
        paneChoice[card.dataset.route] = card._panes[i];
        lsSet(HS_KEY, paneChoice);
      }
      card._idx = i;
      setDots(card);
    }

    // Touch swipe: axis-locked, 1:1 while dragging, rubber band at the ends, and on release
    // a flick or a >15% drag moves one pane. The snap is short and its duration shrinks
    // with release speed, so a fast flick lands fast instead of gliding.
    function initCarouselSwipe(card, sw) {
      const track = card.querySelector('.rcard-track');
      let x0, y0, lastX, lastT, vel, dx, axis = null, active = false;
      sw.addEventListener('touchstart', e => {
        if (e.touches.length !== 1) { active = false; return; }
        active = true; axis = null; dx = 0; vel = 0;
        x0 = lastX = e.touches[0].clientX; y0 = e.touches[0].clientY; lastT = performance.now();
      }, { passive: true });
      sw.addEventListener('touchmove', e => {
        if (!active) return;
        const t = e.touches[0];
        const mx = t.clientX - x0, my = t.clientY - y0;
        if (!axis) {
          if (Math.abs(mx) + Math.abs(my) < 6) return; // same lock rule as the sheet's, so they never disagree
          axis = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
          if (axis === 'x') { track.classList.remove('snapping'); card._dragged = true; }
        }
        if (axis !== 'x') return;
        if (e.cancelable) e.preventDefault();
        const atStart = card._idx === 0 && mx > 0, atEnd = card._idx === card._panes.length - 1 && mx < 0;
        dx = (atStart || atEnd) ? mx / 3 : mx;
        track.style.setProperty('--dx', dx + 'px');
        const now = performance.now();
        vel = (t.clientX - lastX) / Math.max(1, now - lastT);
        lastX = t.clientX; lastT = now;
      }, { passive: false });
      const end = () => {
        if (!active) return;
        active = false;
        if (axis !== 'x') return;
        const w = sw.clientWidth || 1;
        let target = card._idx;
        if (vel < -0.2 || dx < -w * 0.15) target++;
        else if (vel > 0.2 || dx > w * 0.15) target--;
        target = Math.max(0, Math.min(card._panes.length - 1, target));
        const remaining = Math.abs((card._idx - target) * w + dx);
        const ms = Math.max(70, Math.min(130, remaining / Math.max(Math.abs(vel), 3)));
        goToPane(card, target, true, ms);
        setTimeout(() => { card._dragged = false; }, 0);
      };
      sw.addEventListener('touchend', end);
      sw.addEventListener('touchcancel', end);
      // Trackpad horizontal scroll: one pane per gesture.
      let wheelLock = 0, wheelAcc = 0;
      sw.addEventListener('wheel', e => {
        if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
        e.preventDefault();
        if (performance.now() < wheelLock) return;
        wheelAcc += e.deltaX;
        if (Math.abs(wheelAcc) > 40) {
          goToPane(card, card._idx + Math.sign(wheelAcc), true);
          wheelAcc = 0;
          wheelLock = performance.now() + 450;
        }
      }, { passive: false });
    }
    function setDots(card) {
      card.querySelectorAll('.rcard-dot').forEach((d, i) => d.setAttribute('aria-current', String(i === card._idx)));
      const arrows = card.querySelectorAll('.rcard-arrow');
      if (arrows.length) { arrows[0].disabled = card._idx === 0; arrows[1].disabled = card._idx === card._panes.length - 1; }
    }

    function fillPane(pane, p) {
      const body = pane.querySelector('.rpane-body');
      const key = p.deps.map(depKey).join(',');
      if (body.dataset.key === key) return;
      body.dataset.key = key;
      const [first, ...rest] = p.deps;
      body.innerHTML = `
        <div class="dep-card rpane-main">${metaHTML(first)}${statusHTML(first)}${LEAVE_HTML}<div class="row-bus" hidden></div></div>
        ${rest.length ? `<div class="rpane-next">${rest.map(d => `<div class="dep-card rpane-sub">${LEAVE_HTML}${statusHTML(d)}${
          d._stopId !== first._stopId ? `<div class="row-meta">${escapeHtml(d._stopName || '')}</div>` : ''}</div>`).join('')}</div>` : ''}`;
      body.querySelectorAll('.dep-card').forEach((el, i) => setDepAttrs(el, p.deps[i]));
    }

    function updateETAs() {
      const now = nowInSeconds();
      document.querySelectorAll('#scroller .dep-card').forEach(el => {
        const dep = el._dep;
        if (!dep) return;
        const l = fmtLeave(dep);
        const box = el.querySelector('.row-leave');
        const numEl = box.querySelector('.row-leave-num');
        const changed = numEl.textContent !== l.num;
        numEl.textContent = l.num;
        box.querySelector('.row-leave-unit').textContent = l.unit;
        box.className = 'row-leave' + (l.cls ? ' ' + l.cls : '');
        if (changed && el.dataset.shown && !reduceMotion()) {
          void box.offsetWidth;
          box.classList.add('eta-roll');
        }
        el.dataset.shown = '1';
        el.classList.toggle('is-later', l.cls === 'later');
        el.classList.toggle('row-missed', l.cls !== 'past' && Number(el.dataset.walkSec) > realTime(dep) - now);
      });
    }

    function reduceMotion() { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }

    // Re-sort + relabel every 15 s, and pull fresh RT for every stop on the board.
    function rtTick() {
      renderBoard();
      lastStopDatas.forEach(s => loadRTStopUpdates(s.stop_id));
      refreshTripDelays();
      trackBus();
      refreshCardBuses();
      loadAlerts();
    }

    // ===== Refresh button: location + departures + realtime (delays, card buses, selected bus) =====
    document.getElementById('refreshBtn').addEventListener('click', () => {
      const btn = document.getElementById('refreshBtn');
      if (btn.classList.contains('refreshing')) return;
      btn.classList.add('refreshing');
      btn.setAttribute('aria-busy', 'true');
      rtStopCache = new Map(); // fetch realtime fresh rather than reuse the last 15 s
      const done = () => { btn.classList.remove('refreshing'); btn.removeAttribute('aria-busy'); };
      loadAlerts(true);
      Promise.resolve(loadLocation())
        .then(() => Promise.all(lastStopDatas.map(sd => loadRTStopUpdates(sd.stop_id))))
        .then(() => { renderBoard(); refreshTripDelays(true); trackBus(); refreshCardBuses(); })
        .catch(() => {})
        .finally(done);
    });

    // ===== Lifecycle: timers only run while the page is visible (phones background tabs) =====
    function secondTick() {
      renderHeaderSub(); // "Updated 12s ago" counts every second
      tickVehicles();
    }
    function startTimers() {
      stopTimers();
      timers.push(setInterval(loadLocation, BOARD_REFRESH_MS));
      timers.push(setInterval(rtTick, BOARD_RT_MS));
      timers.push(setInterval(secondTick, 1000));
    }
    function stopTimers() { timers.forEach(clearInterval); timers = []; }
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { stopTimers(); stopGeoWatch(); return; }

    // ===== Bottom sheet =====

    (function initSheetDrag() {
      const grab = document.getElementById('sheetGrab');
      let y0 = null, dy = 0, t0 = 0;
      grab.addEventListener('pointerdown', e => {
        if (e.target.closest('button')) return;
        y0 = e.clientY; dy = 0; t0 = performance.now();
        sheet.classList.add('dragging');
        grab.setPointerCapture(e.pointerId);
      });
      grab.addEventListener('pointermove', e => {
        if (y0 == null) return;
        dy = Math.max(0, e.clientY - y0);
        sheet.style.setProperty('--drag', dy + 'px');
      });
      const end = () => {
        if (y0 == null) return;
        y0 = null;
        sheet.classList.remove('dragging');
        const fast = dy / Math.max(1, performance.now() - t0) > 0.6;
        if (dy > 120 || (fast && dy > 30)) closeSheet();

    // ===== Location =====

    function renderSavedLocations() {
      const box = document.getElementById('locSaved');
      const saved = getSavedLocations();
      box.innerHTML = saved.length ? '' : '<div class="sh-empty">Nothing saved yet.</div>';

    function saveCurrentLocation() {
      const nickEl = document.getElementById('locNick');
      const name = nickEl.value.trim();
      if (!name || boardLat == null) { nickEl.focus(); return; }
      const cur = getSavedLocations().filter(l => l.name.toLowerCase() !== name.toLowerCase());
      cur.push({ name, lat: boardLat, lon: boardLon });

    function refreshLocPanel() {
      document.getElementById('locName').textContent = boardLabel();

      document.getElementById('locGps').classList.toggle('is-current', !boardCustom);

    const runLocSearch = debounce(q => {
      const box = document.getElementById('locResults');
      if (!q) { box.innerHTML = ''; return; }
      apiFetch('/api/searchstop/' + encodeURIComponent(q))
        .then(r => r.ok ? r.json() : { matches: [] })
        .then(d => {
          if (document.getElementById('locSearch').value.trim() !== q) return;
          const ms = (d.matches || []).filter(m => isFinite(m.lat) && isFinite(m.lon)).slice(0, 8);
          box.innerHTML = ms.length ? '' : '<div class="sh-empty">No stops found.</div>';
          ms.forEach(m => {
            const b = document.createElement('button');
            b.type = 'button'; b.className = 'sh-btn';
            b.innerHTML = `<span class="grow">${escapeHtml(m.stop_name)}<small>${escapeHtml(m.stop_code || m.stop_id)}</small></span>`;
            b.addEventListener('click', () => {
              document.getElementById('locSearch').value = '';
              box.innerHTML = '';

            });

          });
        })
        .catch(() => { box.innerHTML = '<div class="sh-empty">Search failed.</div>'; });
    }, 250);

    function submitCoords() {
      const inp = document.getElementById('locCoords'), err = document.getElementById('locCoordsErr');
      const m = inp.value.trim().match(/^(-?\d+(?:\.\d+)?)\s*[,\s]\s*(-?\d+(?:\.\d+)?)$/);
      const lat = m ? parseFloat(m[1]) : NaN, lon = m ? parseFloat(m[2]) : NaN;
      if (!m || Math.abs(lat) > 90 || Math.abs(lon) > 180) { err.hidden = false; return; }
      err.hidden = true;
      inp.value = '';
      setBoardLocation({ lat, lon, name: `${lat.toFixed(4)}, ${lon.toFixed(4)}` });
    }
    document.getElementById('locCoordsGo').addEventListener('click', submitCoords);
    document.getElementById('locCoords').addEventListener('keydown', e => { if (e.key === 'Enter') submitCoords(); });
    document.getElementById('locGps').addEventListener('click', () => setBoardLocation(null));
    document.getElementById('locSave').addEventListener('click', saveCurrentLocation);
    document.getElementById('locNick').addEventListener('keydown', e => { if (e.key === 'Enter') saveCurrentLocation(); });
    document.getElementById('locSearch').addEventListener('input', e => runLocSearch(e.target.value.trim()));

    // ===== Memory (localStorage) =====
    // Recent stops share index.html's list ('gtfs-recent-stops', same entry shape, newest
    // first, 6 max), so a stop picked on either page shows up on both. The last trip/route
    // put on the map and the map zoom are this page's own.
    const RECENT_STOPS_KEY = 'gtfs-recent-stops';
    const RECENT_STOPS_MAX = 6;
    const SELECTION_KEY = 'gtfs-phone-selection'; // {date, type:'trip'|'route', key, trip_id, route_id}
    const ZOOM_KEY = 'gtfs-phone-map-zoom';

    function getRecentStops() {
      const v = lsGet(RECENT_STOPS_KEY, []);
      return Array.isArray(v) ? v.filter(r => r && r.stop_id != null && r.stop_name) : [];
    }
    function rememberRecentStop(m) {
      const entry = { stop_id: String(m.stop_id), stop_name: m.stop_name || '', stop_code: m.stop_code || '', lat: +m.lat, lon: +m.lon, group: false };
      const rest = getRecentStops().filter(r => !(String(r.stop_id) === entry.stop_id && !r.group));
      lsSet(RECENT_STOPS_KEY, [entry, ...rest].slice(0, RECENT_STOPS_MAX));
    }
    function renderRecentStops() {
      const box = document.getElementById('locRecent');
      const list = getRecentStops().filter(r => isFinite(r.lat) && isFinite(r.lon));
      document.getElementById('locRecentHead').hidden = !list.length;
      box.hidden = !list.length;
      box.innerHTML = '';
      list.forEach(r => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'sh-btn' + (boardCustom && boardCustom.lat === +r.lat && boardCustom.lon === +r.lon ? ' active' : '');
        b.innerHTML = `<span class="grow">${escapeHtml(r.stop_name)}<small>${escapeHtml(r.group ? 'All stops with this name' : 'Stop ' + (r.stop_code || r.stop_id))}</small></span>`;
        b.addEventListener('click', () => { rememberRecentStop(r); setBoardLocation({ lat: r.lat, lon: r.lon, name: r.stop_name }); });
        box.appendChild(b);
      });
    }
    document.getElementById('locRecentClear').addEventListener('click', () => {
      try { localStorage.removeItem(RECENT_STOPS_KEY); } catch (e) {}
      renderRecentStops();
    });

    function saveSelection(sel) { lsSet(SELECTION_KEY, sel ? { date: todayStr(), ...sel } : null); }
    // Once per page load, after the first board: put the last trip/route back on the map
    // if it's still on today's board.
    let selectionRestored = false;
    function restoreSelection() {
      if (selectionRestored || !map) return;
      selectionRestored = true;
      const sel = lsGet(SELECTION_KEY, null);
      if (!sel || sel.date !== todayStr()) return;
      if (sel.type === 'trip') {
        const dep = upcoming().find(d => depKey(d) === sel.key);
        if (dep) openTrip(dep);
      } else if (sel.type === 'route') {
        const dep = upcoming().find(d => d.route_id === sel.route_id);
        if (dep) openRoute(dep);
      }
    }
    function savedZoom() { const z = lsGet(ZOOM_KEY, 16); return isFinite(z) && z >= 3 && z <= 19 ? z : 16; }

    // ===== Display toggles =====
    function bindToggle(id, key, bodyClass, onChange) {
      const cb = document.getElementById(id);
      const apply = on => { document.body.classList.toggle(bodyClass, on); cb.checked = on; };
      apply(lsGet(key, false) === true);
      cb.addEventListener('change', () => { apply(cb.checked); lsSet(key, cb.checked); if (onChange) onChange(); });
    }
    bindToggle('listToggle', 'gtfs-phone-list', 'list-view', () => { document.getElementById('board').dataset.key = ''; renderBoard(); });
    bindToggle('showWalkToggle', 'gtfs-board-show-walk', 'show-walk', () => { renderHeaderSub(); updateETAs(); });  // shared with depboard
    bindToggle('hideClockToggle', 'gtfs-board-hide-clock', 'hide-clock');                                         // shared with depboard
    (sel => {
      sel.value = String(laterHours);
      sel.addEventListener('change', () => {
        laterHours = LATER_CHOICES.includes(+sel.value) ? +sel.value : 3;
        lsSet(LATER_KEY, laterHours);
        document.getElementById('board').dataset.key = '';
        renderBoard();
      });
    })(document.getElementById('laterSelect'));

    function syncThemeColor() {
      document.getElementById('themeColorMeta').setAttribute('content', getComputedStyle(document.documentElement).getPropertyValue('--bg').trim());
    }
    (function initThemeToggle() {
      const cb = document.getElementById('lightThemeToggle');
      const root = document.documentElement;
      cb.checked = root.getAttribute('data-theme') === 'light';
      cb.addEventListener('change', () => {
        const theme = cb.checked ? 'light' : 'dark';
        root.setAttribute('data-theme', theme);
        try { localStorage.setItem('gtfs-theme', theme); } catch (e) {}
        syncThemeColor();
      });
      syncThemeColor();
    })();

    // Keep screen on (Screen Wake Lock); the lock drops when the page hides, so re-request on return.
    let wakeWanted = false, wakeLock = null;
    function requestWake() {
      if (!('wakeLock' in navigator) || document.hidden) return;
      navigator.wakeLock.request('screen').then(l => { wakeLock = l; }).catch(() => {});
    }
    (function initWake() {
      const cb = document.getElementById('wakeToggle');
      if (!('wakeLock' in navigator)) { document.getElementById('wakeRow').hidden = true; return; }
      wakeWanted = lsGet('gtfs-phone-wakelock', false) === true;
      cb.checked = wakeWanted;
      if (wakeWanted) requestWake();
      cb.addEventListener('change', () => {
        wakeWanted = cb.checked;
        lsSet('gtfs-phone-wakelock', wakeWanted);
        if (wakeWanted) requestWake();
        else if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
      });
    })();

    // Keep the sheet's inputs above the on-screen keyboard (it only shrinks the visual viewport).
    (function initKeyboardAvoidance() {
      const vv = window.visualViewport;
      if (!vv) return;
      const update = () => {
        const kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
        document.documentElement.style.setProperty('--kb-h', (kb > 100 ? kb : 0) + 'px');
      };
      vv.addEventListener('resize', update);
      vv.addEventListener('scroll', update);
      update();
    })();

    // ===== MAP =====
    let map = null, stopLayer = null, hereMarker = null, mapLocKey = '', focusedStopId = null;
    const stopMarkers = new Map(); // stop_id -> L.marker (stop sign icon)
    const STOP_MK_ROUTES = 4;      // bullets per stop sign before "+N"
    // Declutter: board stops get a sign only where it fits (and at most SIGN_MAX of them,
    // nearest first, from zoom SIGN_MIN_Z); the rest are small squares. Stops along a
    // drawn trip / route keep LINE_STOP_GAP px apart, the rest hidden until you zoom in.
    const SIGN_MAX = 4;
    const SIGN_MIN_Z = 15;
    const LINE_STOP_GAP = 20;
    let lineStops = [];   // [{m, pri}] markers along the drawn trip / route (lower pri = kept first)
    let lineFocus = null; // the line stop last picked from the timeline: always shown
    // Follow mode: the board's location (GPS dot or picked spot) stays centred in the
    // visible part of the map — above the sheet — so raising the sheet by h moves it up
    // h/2. Panning the map or opening a stop turns it off and shows the one-time Recenter
    // pill, which flies back and hides again.
    let mapFollow = true;
    const FOLLOW_BREAK_PX = 48; // drag further than this and the map stops following

    function initMap() {
      if (!window.L) return;
      map = L.map('map', { zoomControl: false, attributionControl: false }).setView([43.88, -79.34], 11);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
      L.control.attribution({ position: 'topleft', prefix: false })
        .addAttribution('© OpenStreetMap contributors · Unofficial, not affiliated with York Region Transit')
        .addTo(map);
      if (isWide()) L.control.zoom({ position: 'bottomright' }).addTo(map);
      stopLayer = L.layerGroup().addTo(map);
      // A drag only leaves follow mode once the location has moved FOLLOW_BREAK_PX: the
      // stray finger travel of a pinch (or a nudge) springs back to centre instead.
      let dragFrom = null;
      const locPx = () => map.latLngToContainerPoint([boardLat, boardLon]);
      map.on('dragstart', () => {
        dragFrom = mapFollow && boardLat != null ? locPx() : null;
        if (!dragFrom) setFollow(false);
      });
      map.on('drag', () => {
        if (dragFrom && locPx().distanceTo(dragFrom) > FOLLOW_BREAK_PX) { dragFrom = null; setFollow(false); }
      });
      map.on('dragend', () => {
        if (!dragFrom) return;
        dragFrom = null;
        // after Leaflet starts its inertia glide (fired right after dragend), so stop that first
        setTimeout(() => { if (mapFollow) { map.stop(); followMap(true); } }, 0);
      });
      // Two-finger gestures don't fire drag events: a pinch whose midpoint wanders further
      // than FOLLOW_BREAK_PX is a pan, so it leaves follow mode too; a plain pinch doesn't.
      let pinchFrom = null;
      const mid = t => L.point((t[0].clientX + t[1].clientX) / 2, (t[0].clientY + t[1].clientY) / 2);
      const mc = map.getContainer();
      mc.addEventListener('touchstart', e => { pinchFrom = e.touches.length === 2 && mapFollow ? mid(e.touches) : null; }, { passive: true });
      mc.addEventListener('touchmove', e => {
        if (pinchFrom && e.touches.length === 2 && mid(e.touches).distanceTo(pinchFrom) > FOLLOW_BREAK_PX) { pinchFrom = null; setFollow(false); }
      }, { passive: true });
      mc.addEventListener('touchend', e => { if (e.touches.length < 2) pinchFrom = null; }, { passive: true });
      map.createPane('lineStopPane').style.zIndex = 360; // stops along a trip / route, over its line
      map.on('zoomend', () => {
        declutter();
        if (mapFollow && boardLat != null) lsSet(ZOOM_KEY, map.getZoom()); // zoom around your location only, not trip/route fits
        followMap(true); // a pinch / double-tap zooms around the fingers: ease back to the location
      });
    }

    function safeTopPx() { return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-top-px')) || 0; }
    // Where the location should sit: centre of the map area not covered by the sheet/panel.
    function followPoint() {
      const size = map.getSize();
      if (isWide()) return L.point(452 + (size.x - 452) / 2, size.y / 2);
      return L.point(size.x / 2, (safeTopPx() + size.y - sheetVisible()) / 2);
    }
    function mapPadding() {
      if (isWide()) return { paddingTopLeft: [470, 40], paddingBottomRight: [40, 40] };
      return { paddingTopLeft: [40, 60 + safeTopPx()], paddingBottomRight: [40, sheetVisible() + 24] };
    }
    function setFollow(on) {
      mapFollow = on;
      document.body.classList.toggle('map-off-center', !on && boardLat != null);
    }
    // Per-frame while following: nudge the map so the location stays at followPoint().
    // animate: a short ease instead (after a zoom or a small drag), skipped under reduced motion.
    function followMap(animate) {
      if (!map || !mapFollow || boardLat == null) return;
      const d = map.latLngToContainerPoint([boardLat, boardLon]).subtract(followPoint());
      if (Math.abs(d.x) < 0.5 && Math.abs(d.y) < 0.5) return;
      const ease = animate && !reduceMotion() && Math.hypot(d.x, d.y) > 2;
      map.panBy(d, ease ? { animate: true, duration: 0.22, easeLinearity: 0.5, noMoveStart: true } : { animate: false, noMoveStart: true });
    }
    // Jump/fly to the location at a street-level zoom, offset into the visible area.
    function centerOnLocation(animate, zoom) {
      if (!map || boardLat == null) return;
      const z = zoom ?? savedZoom();
      const offset = followPoint().subtract(map.getSize().divideBy(2));
      const center = map.unproject(map.project([boardLat, boardLon], z).subtract(offset), z);
      map.setView(center, z, { animate: animate && !reduceMotion() });
    }

    function renderMap() {
      if (!map) return;
      // Location marker follows the user's choice: blue dot for live GPS, pin for a picked stop/spot.
      if (hereMarker) { hereMarker.remove(); hereMarker = null; }
      if (boardLat != null) {
        const icon = boardCustom
          ? L.divIcon({ className: '', html: '<div class="here-pin"><svg viewBox="0 0 24 32"><path fill="currentColor" stroke="#fff" stroke-width="2" d="M12 1C6 1 1.5 5.5 1.5 11.3 1.5 19 12 31 12 31s10.5-12 10.5-19.7C22.5 5.5 18 1 12 1z"/><circle cx="12" cy="11.5" r="4" fill="#fff"/></svg></div>', iconSize: [26, 34], iconAnchor: [13, 33] })
          : L.divIcon({ className: '', html: '<div class="here-dot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });
        hereMarker = L.marker([boardLat, boardLon], { icon, keyboard: false, interactive: false, zIndexOffset: 1000 }).addTo(map);
      }
      stopLayer.clearLayers();
      stopMarkers.clear();
      lastStopDatas.forEach(sd => {
        if (!isFinite(sd._lat) || !isFinite(sd._lon)) return;
        const focus = String(sd.stop_id) === String(focusedStopId);
        const m = L.marker([sd._lat, sd._lon], { icon: stopIcon(sd, focus), zIndexOffset: focus ? 500 : 0 });
        m._dist = sd._distanceKM || 0;
        // Registered before the popup so the stop view is already open when the popup renders.
        m.on('click', () => {
          setFollow(false);
          setFocusedStop(sd.stop_id);
          if (view.type === 'board' || view.type === 'stop') openStop(sd.stop_id); // over a trip/route: the popup's button
        });
        m.bindPopup(() => stopPopupHTML(sd), { autoPanPaddingTopLeft: mapPadding().paddingTopLeft, autoPanPaddingBottomRight: mapPadding().paddingBottomRight });
        m.addTo(stopLayer);
        stopMarkers.set(String(sd.stop_id), m);
      });
      // A new location (or the first GPS fix) re-centres and turns follow back on; refreshes don't.
      const key = boardLat == null ? '' : `${boardCustom ? 'c' : 'g'}:${boardCustom ? boardLat.toFixed(5) + ',' + boardLon.toFixed(5) : ''}`;
      if (key && key !== mapLocKey) { mapLocKey = key; setFollow(true); centerOnLocation(false, savedZoom()); }
      else followMap(); // live GPS moved: keep the dot centred while following
      declutter();
    }

    // Keep the map readable on a phone: greedy placement in screen space, most useful first.
    // Board stops: the focused stop, then nearest. Each gets its sign if the sign's box
    // misses every sign already placed, the location dot and the other board stops;
    // otherwise it's a square. In a trip / route view only the focused stop keeps a sign.
    // Then the line stops, by priority, each kept only with LINE_STOP_GAP px of room.
    // Pixel layout only changes with zoom, so this runs on zoomend and when markers change.
    let declutterQueued = false;
    function scheduleDeclutter() {
      if (declutterQueued) return;
      declutterQueued = true;
      requestAnimationFrame(declutter);
    }
    function declutter() {
      declutterQueued = false;
      if (!map) return;
      const placed = [];
      const hits = r => placed.some(q => r.x0 < q.x1 && r.x1 > q.x0 && r.y0 < q.y1 && r.y1 > q.y0);
      const box = (p, r) => ({ x0: p.x - r, y0: p.y - r, x1: p.x + r, y1: p.y + r });
      const pt = ll => map.latLngToLayerPoint(ll);
      if (boardLat != null) placed.push(box(pt([boardLat, boardLon]), 12));

      const board = [...stopMarkers.entries()].map(([id, m]) => ({ id, m, el: m.getElement(), p: pt(m.getLatLng()), focus: id === String(focusedStopId) }));
      board.sort((a, b) => (b.focus - a.focus) || (a.m._dist - b.m._dist));
      // Measure each new sign once (writes first, then reads, so it's one layout).
      const fresh = board.filter(b => !b.m._sz && b.el);
      fresh.forEach(b => b.el.classList.remove('is-tick'));
      fresh.forEach(b => { const sg = b.el.querySelector('.stop-mk'); b.m._sz = sg && sg.offsetWidth ? [sg.offsetWidth, sg.offsetHeight] : [60, 24]; });
      const ticks = board.map(b => box(b.p, 7));
      const wide = map.getZoom() >= SIGN_MIN_Z;
      let signs = 0;
      board.forEach((b, bi) => {
        const [w, h] = b.m._sz || [60, 24];
        const r = { x0: b.p.x - w / 2 - 3, x1: b.p.x + w / 2 + 3, y0: b.p.y - 8 - h - 3, y1: b.p.y };
        const others = ticks.some((t, ti) => ti !== bi && r.x0 < t.x1 && r.x1 > t.x0 && r.y0 < t.y1 && r.y1 > t.y0);
        const sign = b.focus || (!inDetail() && wide && signs < SIGN_MAX && !others && !hits(r));
        if (sign) signs++;
        placed.push(sign ? r : ticks[bi]);
        if (b.el) b.el.classList.toggle('is-tick', !sign);
        b.m.options.icon.options.popupAnchor = sign ? [0, -h - 10] : [0, -8];
      });

      [...lineStops].sort((a, b) => ((b.m === lineFocus) - (a.m === lineFocus)) || (linePri(a) - linePri(b))).forEach(s => {
        const r = box(pt(s.m.getLatLng()), LINE_STOP_GAP / 2);
        const show = s.m === lineFocus || !hits(r);
        if (show) placed.push(r);
        const el = s.m.getElement();
        if (el) el.classList.toggle('is-off', !show);
      });
    }
    // Trip: where you get off, the last and first stops, then stops still ahead in order, then passed ones.
    function linePri(s) {
      const v = tripView;
      if (s.pri != null || !v) return s.pri ?? 9;
      const i = s.m._i, n = v.stops.length;
      if (view.type === 'trip' && i === view.dest) return 0;
      if (i === n - 1) return 1;
      if (i === 0) return 2;
      return (i < (v.passedBefore || 0) ? 5 : 3) + i / 1e4;
    }
    function lineStopMarker(lat, lon, cls) {
      const big = /is-end|is-dest/.test(cls);
      return L.marker([lat, lon], {
        pane: 'lineStopPane', keyboard: false,
        icon: L.divIcon({ className: 'line-stop ' + cls, iconSize: big ? [13, 13] : [10, 10], popupAnchor: [0, -6] }),
      });
    }

    // Routes still leaving this stop, soonest first; with none left it shows the stop code.
    function stopIcon(sd, focus) {
      const now = nowInSeconds(), id = String(sd.stop_id), seen = new Set();
      allDeps.filter(d => String(d._stopId) === id && stillHere(d, now))
        .sort((a, b) => realTime(a) - realTime(b))
        .forEach(d => seen.add(d.route_id));
      const routes = [...seen];
      const bullets = routes.slice(0, STOP_MK_ROUTES)
        .map(r => `<b style="${routeStyle(routeColors.get(r))}">${escapeHtml(r)}</b>`).join('')
        + (routes.length > STOP_MK_ROUTES ? `<b class="stop-mk-more">+${routes.length - STOP_MK_ROUTES}</b>` : '');
      const name = escapeHtml(sd._stopName || sd.stop_name || sd.stop_id);
      return L.divIcon({
        className: 'stop-mk-wrap' + (focus ? ' is-focus' : ''),
        html: `<div class="stop-mk" title="${name}">${bullets || `<b class="stop-mk-none">${escapeHtml(sd._stopCode || sd.stop_id)}</b>`}</div><div class="stop-tick" title="${name}"></div>`,
        iconSize: [0, 0], iconAnchor: [0, 0], popupAnchor: [0, -34],
      });
    }

    function stopPopupHTML(sd) {
      const routes = [...new Set((sd.departures || []).map(d => d.route_id))]
        .sort(routeCmp)
        .map(r => `<span class="flt-bullet" style="${routeStyle(routeColors.get(r))}">${escapeHtml(r)}</span>`).join('');
      return `<div class="stop-pop-name">${escapeHtml(sd._stopName || sd.stop_name || sd.stop_id)}</div>
        <div class="stop-pop-code">Stop ${escapeHtml(sd._stopCode || sd.stop_id)}${document.body.classList.contains('show-walk') ? ` · ${escapeHtml(fmtWalk(sd._distanceKM || 0))}` : ''}</div>
        ${routes ? `<div class="stop-pop-routes">${routes}</div>` : ''}${boardStopTripTime(sd)}${
          view.type === 'stop' && view.stopId === String(sd.stop_id) ? '' : `<button type="button" class="pop-btn" data-pop-stop="${escapeHtml(sd.stop_id)}">Departures here</button>`}`;
    }
    // In a trip / route stop's popup: move the board to that stop.
    function nearBtn(id, code, name, lat, lon) {
      return `<button type="button" class="pop-btn" data-pop-loc data-id="${escapeHtml(id)}" data-code="${escapeHtml(code || '')}" data-name="${escapeHtml(name || '')}" data-lat="${+lat}" data-lon="${+lon}">Departures near here</button>`;
    }
    // Leaflet stops clicks at the popup, so catch its buttons on the way down.
    document.getElementById('map').addEventListener('click', e => {
      const stopBtn = e.target.closest('[data-pop-stop]');
      if (stopBtn) {
        e.stopPropagation();
        const id = stopBtn.dataset.popStop;
        openStop(id);
        const m = stopMarkers.get(String(id));
        if (m && m.isPopupOpen()) m.getPopup().update();
        return;
      }
      const locBtn = e.target.closest('[data-pop-loc]');
      if (locBtn) {
        e.stopPropagation();
        const d = locBtn.dataset;
        map.closePopup();
        rememberRecentStop({ stop_id: d.id, stop_name: d.name, stop_code: d.code, lat: +d.lat, lon: +d.lon });
        setBoardLocation({ lat: +d.lat, lon: +d.lon, name: d.name || `Stop ${d.id}` });
      }
    }, true);
    function boardStopTripTime(sd) {
      const v = tripView;
      if (!v || String(sd.stop_id) !== v.boardStopId) return '';
      const i = v.stops.findIndex(s => String(s.id) === v.boardStopId);
      return i < 0 ? '' : tripTimeHTML(v.stops[i], v.delays[i]);
    }

    function setFocusedStop(stopId) {
      focusedStopId = stopId;
      stopMarkers.forEach((m, id) => {
        const el = m.getElement && m.getElement();
        if (el) el.classList.toggle('is-focus', id === String(stopId));
        m.setZIndexOffset(id === String(stopId) ? 500 : 0);
      });
      declutter();
    }

    // Route number (or its alert flag) -> the route view; any departure -> that trip's view.
    // Covers the board and the departure rows inside a route / stop view.
    document.getElementById('scroller').addEventListener('click', e => {
      const rc = e.target.closest('.rcard');
      if (rc && rc._dragged) return;
      if (e.target.closest('a, summary, .rcard-nav, [data-act], .tl')) return;
      const badge = e.target.closest('.row-route, .rcard-flag');
      if (badge) {
        const host = badge.closest('.row');
        const dep = host ? host._dep : rc && rc.querySelectorAll('.rpane')[rc._idx || 0]?.querySelector('.dep-card')?._dep;
        if (dep) openRoute(dep);
        return;
      }
      const card = e.target.closest('.dep-card');
      if (card && card._dep) openTrip(card._dep);
    });
    document.getElementById('recenterBtn').addEventListener('click', () => { setFollow(true); centerOnLocation(true); });

    // ===== TRIP / ROUTE ON THE MAP =====
    let overlayLayer = null, overlayReq = 0, selectedKey = null, selectedRoute = null;
    let changingLocation = false; // a location switch clears the map but keeps the remembered selection
    const realRouteIds = new Map(); // board route_id ("025") -> feed route_id ("25"), learned from /api/trip

    function ensureOverlay() {
      if (overlayLayer) return;
      map.createPane('routePane').style.zIndex = 350; // above tiles, below the board's stop dots
      overlayLayer = L.layerGroup().addTo(map);
    }
    function lineColor(c) {
      c = String(c || '').replace('#', '');
      return /^[0-9a-fA-F]{6}$/.test(c) ? '#' + c : getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    }
    function clearOverlay() {
      overlayReq++;
      tripView = null;
      clearBus();
      if (overlayLayer) overlayLayer.clearLayers();
      lineStops = []; lineFocus = null;
      scheduleDeclutter();
      selectedKey = selectedRoute = null;
      if (!changingLocation) saveSelection(null);
      markSelection();
    }

    // Outline whatever is on the map; re-run after every board render.
    function markSelection() {
      document.querySelectorAll('#board .dep-card').forEach(el => {
        el.classList.toggle('is-selected', !!selectedKey && !!el._dep && depKey(el._dep) === selectedKey);
        if (el.classList.contains('row')) el.classList.toggle('route-selected', !!selectedRoute && el._dep && el._dep.route_id === selectedRoute);
      });
      document.querySelectorAll('#board .rcard').forEach(c => c.classList.toggle('route-selected', !!selectedRoute && c.dataset.route === selectedRoute));
    }

    // Leave follow mode and make sure some map is showing above the sheet.
    function makeRoomForOverlay() {
      setFollow(false);
      if (!isWide() && pos > sheetTravel() * 0.55) { stopMomentum(); setPos(sheetTravel() * 0.4); savePos(); }
    }
    function fitOverlay(points, maxZoom) {
      if (points.length > 1) map.fitBounds(L.latLngBounds(points), { ...mapPadding(), maxZoom, animate: !reduceMotion() });
    }

    // ===== Delays at the shown trip's stops =====
    // Realtime trip updates are only reachable per stop, but each entity carries the whole
    // trip's stop_time_updates, so asking for the trip's last stop (always still ahead of
    // the bus) gets them. A delay carries forward to later stops the update leaves out
    // (GTFS-RT propagation); stops before the first update keep their scheduled time.
    let tripView = null; // {trip, stops, boardStopId, markers, delays[]}
    const TRIP_RT_MAX_AGE_MS = 25 * 1000;

    function cachedTripUpdate(tripId) {
      let best = null;
      for (const { data, receivedAt } of rtStopCache.values()) {
        if (Date.now() - receivedAt > RT_STALE_MS) continue;
        const e = (data.entity || []).find(e => e.trip_update?.trip?.trip_id === tripId);
        if (e && (!best || receivedAt > best.receivedAt)) best = { tu: e.trip_update, receivedAt };
      }
      return best;
    }
    function applyTripDelays() {
      const v = tripView;
      if (!v) return;
      const cached = cachedTripUpdate(v.trip.trip_id);
      let carried = null;
      v.delays = v.stops.map(s => {
        if (!cached) return null;
        const d = rtStopDelay(cached.tu, s.id, s.time);
        if (d !== null) carried = d;
        return d !== null ? d : carried;
      });
      // Re-render any popup that's open right now (closed ones render on open).
      v.markers.forEach(m => { if (m.isPopupOpen()) m.getPopup().update(); });
      stopMarkers.forEach((m, id) => { if (id === v.boardStopId && m.isPopupOpen()) m.getPopup().update(); });
      renderTimeline();
    }
    // force: fetch even if a recent update for this trip is cached
    function refreshTripDelays(force) {
      const v = tripView;
      if (!v || !v.stops.length) return;
      applyTripDelays();
      const cached = cachedTripUpdate(v.trip.trip_id);
      if (!force && cached && Date.now() - cached.receivedAt < TRIP_RT_MAX_AGE_MS) return;
      const last = v.stops.reduce((a, b) => (+b.stop_sequence > +a.stop_sequence ? b : a));
      loadRTStopUpdates(String(last.id)).then(() => { if (tripView === v) applyTripDelays(); });
    }

    // Scheduled time, or struck-out scheduled + new time and the delay when the bus is off schedule.
    function tripTimeHTML(stop, delay) {
      if (!stop.time) return '';
      const sched = parseTime(stop.time);
      const schedTxt = fmtClockShort(sched);
      if (delay == null) return `<div class="trip-pop-time"><span>${schedTxt}</span></div>`;
      const mins = Math.round(delay / 60);
      if (mins === 0) return `<div class="trip-pop-time"><span>${schedTxt}</span><span class="tp-badge tp-ontime">On time</span></div>`;
      const cls = mins > 0 ? 'tp-late' : 'tp-early';
      const badge = mins > 0 ? `+${mins} min late` : `${-mins} min early`;
      return `<div class="trip-pop-time"><s>${schedTxt}</s><span class="tp-new ${cls}">${fmtClockShort(sched + delay)}</span><span class="tp-badge ${cls}">${badge}</span></div>`;
    }

    // Shape index of every stop, in order (same in-order nearest-point match).
    function stopShapeIndices(line, stops) {
      const out = [];
      let idx = 0;
      stops.forEach(s => {
        const k = Math.cos(s.lat * Math.PI / 180);
        let best = idx, bd = Infinity;
        for (let j = idx; j < line.length; j++) {
          const d = (line[j][0] - s.lat) ** 2 + ((line[j][1] - s.lng) * k) ** 2;
          if (d < bd) { bd = d; best = j; }
        }
        out.push(idx = best);
      });
      return out;
    }
    function tripLine(t) {
      const stops = (t.stops || []).filter(s => isFinite(s.lat) && isFinite(s.lng));
      const shape = (t.pos_markers || []).filter(p => isFinite(p.lat) && isFinite(p.lng))
        .sort((a, b) => a.sequence - b.sequence).map(p => [p.lat, p.lng]);
      const line = shape.length > 1 ? shape : stops.map(s => [s.lat, s.lng]);
      const idxs = shape.length > 1 ? stopShapeIndices(line, stops) : stops.map((_, i) => i);
      return { stops, line, idxs };
    }

    function showTrip(dep) {
      if (!map) return;
      ensureOverlay();
      const req = ++overlayReq;
      selectedKey = depKey(dep); selectedRoute = null;
      saveSelection({ type: 'trip', key: depKey(dep), trip_id: dep.trip_id, route_id: dep.route_id });
      tripView = null;
      clearBus();
      markSelection();
      if (dep._stopId) setFocusedStop(dep._stopId);
      makeRoomForOverlay();
      fetchTripJson(dep.trip_id).then(t => {
        if (req !== overlayReq) return;
        if (!t) { tripFailed(dep); return; }
        if (t.route_id) realRouteIds.set(dep.route_id, String(t.route_id));
        drawTrip(t, dep);
      });
    }
    function tripFailed(dep) {
      if (view.type !== 'trip' || view.dep !== dep) return;
      view.failed = true;
      renderTimeline();
    }

    function drawTrip(t, dep) {
      overlayLayer.clearLayers();
      const { stops, line, idxs } = tripLine(t);
      if (line.length < 2) { tripFailed(dep); return; }
      const bi = stops.findIndex(s => String(s.id) === String(dep._stopId));
      // The whole trip, whichever stop you board at: nothing faded until a live bus says what's behind it.
      const boardSplit = 0;
      const color = lineColor(t.route_color || dep.route_color);
      const base = { pane: 'routePane', interactive: false, lineJoin: 'round', lineCap: 'round' };
      L.polyline(line, { ...base, color: '#000', weight: 9, opacity: 0.22 }).addTo(overlayLayer);
      // "driven" = behind the live bus (empty until one reports); "ahead" = solid
      const driven = L.polyline([], { ...base, color, weight: 5, opacity: 0.35 }).addTo(overlayLayer);
      const ahead = L.polyline([], { ...base, color, weight: 6, opacity: 1 }).addTo(overlayLayer);
      const prevLayer = L.layerGroup().addTo(overlayLayer); // the bus's previous trip, while it's still on it
      tripView = { trip: t, dep, stops, line, idxs, bi, boardStopId: bi >= 0 ? String(stops[bi].id) : null,
                   markers: [], delays: [], driven, ahead, prevLayer, boardSplit };
      lineStops = []; lineFocus = null;
      stops.forEach((s, i) => {
        if (i === bi) return; // the board's own stop marker marks the boarding stop (its popup gets the time too)
        const ends = i === 0 || i === stops.length - 1;
        const m = lineStopMarker(s.lat, s.lng, ends ? 'is-end' : '')
          .bindPopup(() => `<div class="stop-pop-name">${escapeHtml(s.name)}</div>${tripTimeHTML(s, tripView ? tripView.delays[i] : null)}${nearBtn(s.id, s.code, s.name, s.lat, s.lng)}`,
            { autoPanPaddingTopLeft: mapPadding().paddingTopLeft, autoPanPaddingBottomRight: mapPadding().paddingBottomRight })
          .addTo(overlayLayer);
        m._i = i;
        tripView.markers.push(m);
        lineStops.push({ m });
      });
      setTripSplit(tripView, boardSplit, 0);
      declutter();
      refreshTripDelays();
      trackBus();
      fitOverlay(line, 16);
      renderDetail(); // the trip view's header + stop list
    }

    // Faded up to shape point k, solid after; stops before passedBefore drawn as passed.
    function setTripSplit(v, k, passedBefore) {
      v.driven.setLatLngs(k > 0 ? v.line.slice(0, k + 1) : []);
      v.ahead.setLatLngs(v.line.slice(k));
      v.markers.forEach(m => { const el = m.getElement && m.getElement(); if (el) el.classList.toggle('passed', m._i < passedBefore); });
      markDest(v);
      if (v.passedBefore !== passedBefore) { v.passedBefore = passedBefore; scheduleDeclutter(); }
    }

    // The stop you get off at: a filled square that declutter() keeps first.
    function markDest(v) {
      const dest = view.type === 'trip' ? view.dest : null;
      v.markers.forEach(m => { const el = m.getElement && m.getElement(); if (el) el.classList.toggle('is-dest', m._i === dest); });
      if (v.destShown !== dest) { v.destShown = dest; scheduleDeclutter(); }
    }

    function showRoute(dep) {
      if (!map) return;
      tripView = null;
      clearBus();
      ensureOverlay();
      const req = ++overlayReq;
      selectedRoute = dep.route_id; selectedKey = null;
      saveSelection({ type: 'route', route_id: dep.route_id });
      markSelection();
      makeRoomForOverlay();
      const known = realRouteIds.get(dep.route_id);
      const idP = known ? Promise.resolve(known)
        : apiFetch(`/api/trip/${encodeURIComponent(dep.trip_id)}`).then(r => r.ok ? r.json() : {}).then(t => {
            const id = t.route_id ? String(t.route_id) : dep.route_id;
            realRouteIds.set(dep.route_id, id);
            return id;
          }).catch(() => dep.route_id);
      idP.then(id => apiFetch(`/api/routemap/${encodeURIComponent(id)}/${todayStr()}`))
        .then(r => r.json().then(d => { if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`); return d; }))
        .then(d => {
          if (req !== overlayReq) return;
          drawRoute(d, dep);
          if (view.type === 'route' && view.dep === dep) { view.info = d; syncHead(); }
        })
        .catch(() => {});
    }

    function drawRoute(d, dep) {
      overlayLayer.clearLayers();
      const shapes = (d.shapes || []).filter(s => Array.isArray(s.points) && s.points.length > 1);
      const color = lineColor(d.route_color || dep.route_color);
      const most = Math.max(1, ...shapes.map(s => s.trips || 0));
      const base = { pane: 'routePane', interactive: false, lineJoin: 'round', lineCap: 'round' };
      // Busiest pattern on top; rarer variants fainter.
      [...shapes].sort((a, b) => (a.trips || 0) - (b.trips || 0)).forEach(s => {
        L.polyline(s.points, { ...base, color: '#000', weight: 8, opacity: 0.18 }).addTo(overlayLayer);
        L.polyline(s.points, { ...base, color, weight: 5, opacity: 0.3 + 0.7 * ((s.trips || 0) / most) }).addTo(overlayLayer);
      });
      lineStops = []; lineFocus = null;
      (d.stops || []).forEach(st => {
        if (!isFinite(st.lat) || !isFinite(st.lon)) return;
        const m = lineStopMarker(st.lat, st.lon, '')
          .bindPopup(`<div class="stop-pop-name">${escapeHtml(st.stop_name || st.stop_id)}</div><div class="stop-pop-code">Stop ${escapeHtml(st.stop_code || st.stop_id)}</div>${nearBtn(st.stop_id, st.stop_code, st.stop_name, st.lat, st.lon)}`)
          .addTo(overlayLayer);
        lineStops.push({ m, pri: -(st.trips || 0) }); // busiest stops stay longest
      });
      fitOverlay(shapes.flatMap(s => s.points), 15);
      declutter();
    }

    // ===== THE SELECTED TRIP'S BUS =====
    // 1. If a vehicle reports this trip (/api/rt/location), place it, fade the line behind it
    //    and say how far along it is: STOPPED_AT / INCOMING_AT / IN_TRANSIT_TO a stop
    //    (current_stop_sequence, else stop_id) -> "stopped at X · 3 stops away".
    // 2. Otherwise the bus is usually still working an earlier trip of the same block
    //    (/api/block: same block_id, running order), so look one or two trips back, show that
    //    bus, dash the rest of its current trip, and say when it should finish there (from
    //    that trip's realtime delay at its last stop) and whether that eats into this start.
    const VEH_STALE_SECS = 5 * 60;
    let busLayer = null, bus = null, busReq = 0;
    const blockCache = new Map();   // `${date}|${trip_id}` -> Promise of /api/block json
    const tripJsonCache = new Map(); // trip_id -> Promise of /api/trip json (earlier trips of a block)

    function clearBus() {
      busReq++;
      removeBusMarker();
    }
    function removeBusMarker() {
      if (bus && busLayer) busLayer.removeLayer(bus.marker);
      bus = null;
    }
    function serviceDate(v) {
      if (!v.dep || !(v.dep.prev_day || v.dep.next_day)) return todayStr();
      const y = new Date(); y.setDate(y.getDate() + (v.dep.next_day ? 1 : -1));
      return dateStr(y);
    }
    function fetchVehicle(tripId) {
      return apiFetch(`/api/rt/location/${encodeURIComponent(tripId)}`)
        .then(r => r.ok ? r.json() : null) // 422 = nothing reporting this trip
        .then(data => {
          const e = data && (data.entity || []).find(x => x.vehicle && x.vehicle.position && isFinite(+x.vehicle.position.latitude));
          return e ? { entity: e, ts: Number(e.vehicle.timestamp || data.header?.timestamp) || null } : null;
        })
        .catch(() => null);
    }
    function fetchBlock(tripId, date) {
      const key = `${date}|${tripId}`;
      if (!blockCache.has(key)) blockCache.set(key, apiFetch(`/api/block/${encodeURIComponent(tripId)}/${date}`).then(r => r.ok ? r.json() : null).catch(() => null));
      return blockCache.get(key);
    }
    function fetchTripJson(tripId) {
      if (!tripJsonCache.has(tripId)) {
        tripJsonCache.set(tripId, apiFetch(`/api/trip/${encodeURIComponent(tripId)}`).then(r => r.ok ? r.json() : null).catch(() => null)
          .then(t => { if (!t) tripJsonCache.delete(tripId); return t; })); // a failed load is retried next time
      }
      return tripJsonCache.get(tripId);
    }

    // 'stopped' | 'incoming' | 'transit' (GTFS-RT's default when absent is IN_TRANSIT_TO)
    function vehStatus(veh) {
      const st = String(veh.current_status ?? '');
      if (st === 'STOPPED_AT' || st === '1') return 'stopped';
      if (st === 'INCOMING_AT' || st === '0') return 'incoming';
      return 'transit';
    }
    function stopIndexForVehicle(stops, veh) {
      if (veh.current_stop_sequence != null && veh.current_stop_sequence !== '') {
        const i = stops.findIndex(s => +s.stop_sequence === +veh.current_stop_sequence);
        if (i >= 0) return i;
      }
      return veh.stop_id != null ? stops.findIndex(s => String(s.id) === String(veh.stop_id)) : -1;
    }
    // Shape point for the bus: its stop when stopped there, else the nearest point between
    // the previous stop and the one it's heading to.
    function busShapeIndex(line, idxs, i, status, lat, lon) {
      if (status === 'stopped') return idxs[i];
      const lo = i > 0 ? idxs[i - 1] : 0, hi = idxs[i], k = Math.cos(lat * Math.PI / 180);
      let best = hi, bd = Infinity;
      for (let j = lo; j <= hi; j++) {
        const d = (line[j][0] - lat) ** 2 + ((line[j][1] - lon) * k) ** 2;
        if (d < bd) { bd = d; best = j; }
      }
      return best;
    }
    const plural = (n, w) => `${n} ${w}${n !== 1 ? 's' : ''}`;

    async function trackBus() {
      const v = tripView;
      if (!map || !v) { clearBus(); return; }
      const req = ++busReq;
      const live = () => req === busReq && tripView === v;
      const own = await fetchVehicle(v.trip.trip_id);
      if (!live()) return;
      v.prevLayer.clearLayers();
      if (own) {
        placeBus(own, { route: v.dep.route_id, color: v.trip.route_color || v.dep.route_color });
        showOwnProgress(v, own);
        renderTimeline();
        return;
      }

      // Not on this trip yet: walk back through the block.
      v.busAt = null;
      renderTimeline();
      setTripSplit(v, v.boardSplit, 0);
      const block = await fetchBlock(v.trip.trip_id, serviceDate(v));
      if (!live()) return;
      const trips = (block && block.trips) || [];
      const k = trips.findIndex(t => t.trip_id === v.trip.trip_id);
      if (!block || !block.block_id || k <= 0) { removeBusMarker(); return; }
      for (let back = 1; back <= 2 && k - back >= 0; back++) {
        const pt = trips[k - back];
        const loc = await fetchVehicle(pt.trip_id);
        if (!live()) return;
        if (!loc) continue;
        const prevTrip = await fetchTripJson(pt.trip_id);
        if (!live()) return;
        placeBus(loc, { route: pt.route_short_name || pt.route_id, color: pt.route_color, prev: pt, back, next: trips[k] });
        showPreviousProgress(v, pt, prevTrip, loc);
        return;
      }
      removeBusMarker();
    }

    // ---- Wording for the route cards ----
    const AT_STOP_M = 60, NEAR_STOP_M = 250; // a "passed" bus this close to your stop still counts as here / nearby
    function distM(lat1, lon1, lat2, lon2) {
      const R = 6371000, r = Math.PI / 180;
      const a = Math.sin((lat2 - lat1) * r / 2) ** 2 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin((lon2 - lon1) * r / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }
    // Bus on the trip itself: where it is relative to the rider's stop (bi = index of that stop, -1 if unknown).
    function describeOwn(stops, bi, veh) {
      const status = vehStatus(veh), i = stopIndexForVehicle(stops, veh);
      if (i < 0 || bi < 0) return { i, status, html: 'Bus is on this trip' };
      if (i > bi) {
        // Feeds move current_stop_sequence on as soon as the doors close, so a bus that
        // "passed" may still be right there: go by where it actually is.
        const m = distM(+veh.position.latitude, +veh.position.longitude, stops[bi].lat, stops[bi].lng);
        if (m <= AT_STOP_M) return { i, status, near: true, html: 'Bus is at your stop' };
        if (m <= NEAR_STOP_M) return { i, status, near: true, html: `Bus is ${Math.round(m / 10) * 10} m from your stop` };
        return { i, status, passed: true, html: '<span class="mcb-dim">Bus has passed your stop</span>' };
      }
      if (i === bi) return { i, status, near: status !== 'transit', html: status === 'stopped' ? 'Bus is at your stop' : status === 'incoming' ? 'Bus is arriving at your stop' : 'Bus 1 stop away' };
      // stops still to reach before yours (heading to i means i itself hasn't been reached)
      const away = bi - i + (status === 'transit' ? 1 : 0);
      return { i, status, html: `Bus ${plural(away, 'stop')} away` };
    }

    // Bus still on an earlier trip of the block (pt = that /api/block entry, geo = its tripLine,
    // self = the rider's trip's block entry, back = 1 or 2 trips behind).
    function describePrev(pt, geo, veh, delay, self, back) {
      const status = vehStatus(veh);
      const i = geo ? stopIndexForVehicle(geo.stops, veh) : -1;
      const finish = parseTime(pt.end_time) + delay, start = parseTime(self.start_time);
      const toGo = i < 0 ? null : geo.stops.length - 1 - i + (status === 'transit' ? 1 : 0);
      const lateMin = Math.round(delay / 60);
      const trip = `${escapeHtml(pt.route_short_name || pt.route_id)} to ${escapeHtml(pt.headsign || pt.last_stop_name)}`;
      const ends = `ends ${fmtClockShort(finish)}${lateMin > 0 ? ` <span class="mcb-late">(${lateMin} min late)</span>` : ''}`;
      const squeeze = finish > start ? ' · <span class="mcb-late">may start late</span>' : '';
      return {
        i, status,
        short: `${back === 1 ? 'Bus on previous trip' : 'Bus two trips back'} <span class="mcb-dim">(${trip})</span> · ${toGo != null ? `${plural(toGo, 'stop')} to go · ` : ''}${ends}${squeeze}`,
      };
    }

    // That earlier trip's realtime delay carried to its last stop (0 if none). Uses the
    // stop cache when it's fresh, else asks for its last stop.
    async function prevTripDelay(pt, geo) {
      if (!geo || !geo.stops.length) return 0;
      const fresh = cachedTripUpdate(pt.trip_id);
      if (!fresh || Date.now() - fresh.receivedAt > TRIP_RT_MAX_AGE_MS) await loadRTStopUpdates(String(pt.last_stop_id));
      const c = cachedTripUpdate(pt.trip_id);
      let delay = 0;
      if (c) geo.stops.forEach(st => { const d = rtStopDelay(c.tu, st.id, st.time); if (d !== null) delay = d; });
      return delay;
    }

    function showOwnProgress(v, loc) {
      const veh = loc.entity.vehicle;
      const d = describeOwn(v.stops, v.bi, veh);
      v.busAt = d.i >= 0 ? { i: d.i, status: d.status } : null; // for the trip view's stop list
      if (d.i >= 0) setTripSplit(v, busShapeIndex(v.line, v.idxs, d.i, d.status, +veh.position.latitude, +veh.position.longitude), d.i);
    }

    // Bus still on an earlier trip: dash the rest of that trip and link it to this one.
    function showPreviousProgress(v, pt, prevTrip, loc) {
      const veh = loc.entity.vehicle, status = vehStatus(veh);
      const geo = prevTrip ? tripLine(prevTrip) : null;
      const i = geo ? stopIndexForVehicle(geo.stops, veh) : -1;
      // Dash the rest of the trip the bus is on, plus the link to this trip's first stop.
      if (geo && i >= 0 && geo.line.length > 1) {
        const kk = busShapeIndex(geo.line, geo.idxs, i, status, +veh.position.latitude, +veh.position.longitude);
        const rest = geo.line.slice(kk);
        if (rest.length > 1) L.polyline(rest, { pane: 'routePane', interactive: false, color: lineColor(pt.route_color), weight: 4, opacity: 0.9, dashArray: '2 8', lineCap: 'round' }).addTo(v.prevLayer);
        const end = geo.line[geo.line.length - 1], first = v.line[0];
        if (map.distance(end, first) > 40) L.polyline([end, first], { pane: 'routePane', interactive: false, color: '#666', weight: 3, opacity: 0.8, dashArray: '1 7', lineCap: 'round' }).addTo(v.prevLayer);
      }
      setTripSplit(v, 0, 0); // the bus hasn't started this trip: all of it is ahead
    }

    // ---- Route cards: the same status under each headsign's next departure ----
    // For the next departure of every pane leaving within CARD_BUS_WINDOW_SECS (at most
    // CARD_BUS_MAX trips), refreshed with the realtime tick. Text only: the map still shows
    // just the selected trip's bus.
    const CARD_BUS_WINDOW_SECS = 60 * 60, CARD_BUS_MAX = 12;
    let cardBus = new Map(); // depKey -> {html, ts} (html '' = nothing to say; ts = vehicle fix, unix s)
    let cardBusReq = 0;

    async function cardBusStatus(dep) {
      const tj = await fetchTripJson(dep.trip_id);
      if (!tj) return null;
      const geo = tripLine(tj);
      const bi = geo.stops.findIndex(s => String(s.id) === String(dep._stopId));
      const own = await fetchVehicle(dep.trip_id);
      if (own) {
        const d = describeOwn(geo.stops, bi, own.entity.vehicle);
        setBusFlags(dep, d.near ? 'near' : d.passed ? 'passed' : d.i >= 0 && bi >= 0 ? 'coming' : null);
        return { html: d.html, ts: own.ts };
      }
      setBusFlags(dep, null);
      const block = await fetchBlock(dep.trip_id, serviceDate({ dep }));
      const trips = (block && block.trips) || [];
      const k = trips.findIndex(t => t.trip_id === dep.trip_id);
      if (!block || !block.block_id || k <= 0) return null;
      for (let back = 1; back <= 2 && k - back >= 0; back++) {
        const pt = trips[k - back];
        const loc = await fetchVehicle(pt.trip_id);
        if (!loc) continue;
        const pj = await fetchTripJson(pt.trip_id);
        const pgeo = pj ? tripLine(pj) : null;
        const delay = await prevTripDelay(pt, pgeo);
        setBusFlags(dep, 'coming'); // still finishing an earlier trip: it hasn't reached you
        return { html: describePrev(pt, pgeo, loc.entity.vehicle, delay, trips[k], back).short, ts: loc.ts };
      }
      return null;
    }

    // Where the bus is relative to your stop, for stillHere(). A departure already past its
    // time whose answer changes re-renders the board (so a bus that's gone drops off now).
    function setBusFlags(dep, state) {
      const k = depKey(dep);
      const was = nearBus.has(k) ? 'near' : busPassed.has(k) ? 'passed' : busComing.has(k) ? 'coming' : null;
      nearBus.delete(k); busPassed.delete(k); busComing.delete(k);
      if (state === 'near') nearBus.add(k);
      else if (state === 'passed') busPassed.add(k);
      else if (state === 'coming') busComing.add(k);
      if (was !== state && realTime(dep) < nowInSeconds()) renderBoardSoon();
    }
    const renderBoardSoon = debounce(() => renderBoard(), 100);

    function refreshCardBuses() {
      const now = nowInSeconds();
      const targets = [];
      document.querySelectorAll('#board .rcard .rpane-main').forEach(el => {
        if (el._dep && realTime(el._dep) - now <= CARD_BUS_WINDOW_SECS) targets.push(el._dep);
      });
      // In the list there's no bus line, but a departure that's already gone still asks
      // where its bus is, so it can drop off as soon as the bus has passed.
      document.querySelectorAll('#board .row').forEach(el => {
        if (el._dep && realTime(el._dep) < now) targets.push(el._dep);
      });
      targets.sort((a, b) => realTime(a) - realTime(b));
      const want = targets.slice(0, CARD_BUS_MAX);
      // The trip view's own departure always gets its bus line, however far off it is.
      const hero = document.querySelector('#detail .rpane-main');
      if (hero && hero._dep && !want.some(d => depKey(d) === depKey(hero._dep))) want.unshift(hero._dep);
      const req = ++cardBusReq;
      const next = new Map();
      want.forEach(d => { if (cardBus.has(depKey(d))) next.set(depKey(d), cardBus.get(depKey(d))); }); // keep showing the last text meanwhile
      cardBus = next;
      applyCardBuses();
      want.forEach(dep => {
        cardBusStatus(dep).catch(() => null).then(r => {
          if (req !== cardBusReq) return;
          cardBus.set(depKey(dep), r);
          applyCardBuses();
        });
      });
    }

    function applyCardBuses() {
      document.querySelectorAll('#scroller .rpane-main').forEach(el => {
        const box = el.querySelector('.row-bus');
        if (!box || !el._dep) return;
        const r = cardBus.get(depKey(el._dep));
        const html = r && r.html ? r.html + (r.ts ? ` <span class="mcb-dim">· updated ${escapeHtml(fmtAgo(Date.now() - r.ts * 1000))}</span>` : '') : '';
        if (box.innerHTML !== html) box.innerHTML = html;
        box.hidden = !html;
      });
    }

    function busIcon(info, veh, stale) {
      const b = veh.position.bearing;
      const arrow = b != null && isFinite(b) ? `<i class="bus-dir" style="transform:rotate(${+b}deg)"></i>` : '';
      return L.divIcon({
        className: 'bus-marker',
        html: `<div class="bus${stale ? ' stale' : ''}" style="${routeStyle(String(info.color || '').replace('#', ''))}">${arrow}${escapeHtml(info.route)}</div>`,
        iconSize: [30, 20], iconAnchor: [15, 10],
      });
    }
    function busAgeText() { return bus && bus.ts ? fmtAgo(Date.now() - bus.ts * 1000) : 'Live'; }
    function busPopupHTML() {
      const veh = bus.veh, info = veh.vehicle || {};
      const id = info.label || info.id || bus.entityId || '—';
      const occ = veh.occupancy_status ? String(veh.occupancy_status).replace(/_/g, ' ').toLowerCase().replace(/^\w/, c => c.toUpperCase()) : '';
      const speed = veh.position.speed != null ? `${Math.round(veh.position.speed * 3.6)} km/h` : '';
      const status = { stopped: 'Stopped at a stop', incoming: 'Arriving at a stop', transit: 'In transit' }[vehStatus(veh)];
      const p = bus.info.prev;
      return `<div class="veh-pop-id">Vehicle ${escapeHtml(id)}</div>
        ${p ? `<div class="veh-pop-line">Now on ${escapeHtml(p.route_short_name || p.route_id)} to ${escapeHtml(p.headsign || p.last_stop_name)}</div>
               <div class="veh-pop-line">Then your trip, starting ${fmtClockShort(parseTime(bus.info.next.start_time))}</div>`
            : `<div class="veh-pop-line">On your trip · Route ${escapeHtml(bus.info.route)}</div>`}
        <div class="veh-pop-line">${[status, speed, occ].filter(Boolean).map(escapeHtml).join(' · ')}</div>
        <div class="veh-pop-line">Updated ${escapeHtml(busAgeText())}</div>`;
    }

    function placeBus(loc, info) {
      if (!busLayer) {
        map.createPane('vehiclePane').style.zIndex = 650;
        busLayer = L.layerGroup().addTo(map);
      }
      const veh = loc.entity.vehicle;
      const ll = [+veh.position.latitude, +veh.position.longitude];
      const stale = loc.ts && (Date.now() / 1000 - loc.ts) > VEH_STALE_SECS;
      if (bus && bus.entityId !== loc.entity.id) removeBusMarker(); // a different vehicle: don't glide across town
      if (!bus) {
        bus = { veh, ts: loc.ts, entityId: loc.entity.id, info };
        bus.marker = L.marker(ll, { icon: busIcon(info, veh, stale), pane: 'vehiclePane', keyboard: false })
          .bindPopup(() => busPopupHTML(), { offset: [0, -8] })
          .bindTooltip(busAgeText(), { permanent: true, direction: 'top', offset: [0, -14], className: 'veh-time-tooltip' })
          .addTo(busLayer);
        return;
      }
      Object.assign(bus, { veh, ts: loc.ts, info });
      bus.marker.setIcon(busIcon(info, veh, stale));
      if (!reduceMotion()) {
        const els = [bus.marker.getElement(), bus.marker.getTooltip() && bus.marker.getTooltip().getElement()].filter(Boolean);
        els.forEach(el => el.classList.add('gliding'));
        clearTimeout(bus.glideT);
        bus.glideT = setTimeout(() => els.forEach(el => el.classList.remove('gliding')), 1300);
      }
      bus.marker.setLatLng(ll);
      if (bus.marker.isPopupOpen()) bus.marker.getPopup().update();
    }

    // Every second: the "12s ago" label and an open bus popup.
    function tickVehicles() {
      applyCardBuses();
      if (!bus) return;
      bus.marker.setTooltipContent(busAgeText());
      if (bus.marker.isPopupOpen()) bus.marker.getPopup().update();
    }

    // ===== DEPARTURES SHEET =====
    // One continuous position drives both the sheet and its list: pos 0 = only the header
    // showing, pos = sheetTravel() = sheet at the top, anything past that scrolls the list.
    // So dragging up raises the sheet and then keeps scrolling; dragging down scrolls back
    // to the top of the list and then lowers the sheet. No snap points: it stays where it
    // is released (after a short momentum glide).
    const bsheet = document.getElementById('bsheet');
    const scroller = document.getElementById('scroller');
    const POS_KEY = 'gtfs-phone-sheet-pos'; // sheet height as a fraction of its travel
    const wideMQ = window.matchMedia('(min-width: 900px)');
    function isWide() { return wideMQ.matches; }
    let pos = 0;
    function headHeight() { return document.getElementById('bsheetHead').offsetHeight; }
    function safeBottomPx() { return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-bottom-px')) || 0; }
    function sheetTravel() { return Math.max(0, bsheet.offsetHeight - headHeight() - safeBottomPx()); }
    function maxScroll() { return Math.max(0, scroller.scrollHeight - scroller.clientHeight); }
    function maxPos() { return sheetTravel() + maxScroll(); }
    function sheetVisible() { return isWide() ? 0 : headHeight() + safeBottomPx() + Math.min(pos, sheetTravel()); }

    function setPos(p) {
      if (isWide()) return;
      pos = Math.max(0, Math.min(maxPos(), p));
      const T = sheetTravel(), sp = Math.min(pos, T);
      bsheet.style.setProperty('--sheet-y', (T - sp) + 'px');
      document.documentElement.style.setProperty('--sheet-visible', sheetVisible() + 'px');
      scroller.scrollTop = Math.max(0, pos - T);
      document.body.classList.toggle('sheet-full', sp >= T - 1);
      followMap();
    }
    function savePos() {
      const T = sheetTravel();
      if (T) lsSet(POS_KEY, Math.round(Math.min(pos, T) / T * 1000) / 1000);
    }
    const savePosSoon = debounce(savePos, 300);
    // Back to the top of the list without moving the sheet (location changes).
    function resetListScroll() {
      if (isWide()) scroller.scrollTop = 0;
      else setPos(Math.min(pos, sheetTravel()));
    }
    // Content got shorter (refresh): keep pos inside the new range.
    // Also re-applies pos when the header height changed (chip strip appearing).
    function clampPos() { if (!isWide() && !anim) setPos(pos); }

    let anim = null;
    function stopMomentum() { if (!anim) return false; cancelAnimationFrame(anim); anim = null; return true; }
    function momentum(v) {
      if (Math.abs(v) < 0.05) { savePos(); return; }
      let last = performance.now();
      const step = now => {
        const dt = Math.min(32, now - last); last = now;
        const T = sheetTravel(), prev = pos;
        const next = pos + v * dt;
        // A downward fling through the list stops at its top instead of dropping the sheet.
        if (v < 0 && prev > T && next <= T) { setPos(T); anim = null; savePos(); return; }
        setPos(next);
        v *= Math.pow(0.996, dt);
        if (Math.abs(v) < 0.02 || pos <= 0 || pos >= maxPos()) { anim = null; savePos(); return; }
        anim = requestAnimationFrame(step);
      };
      anim = requestAnimationFrame(step);
    }
    function animateTo(target, ms = 260) {
      stopMomentum();
      const from = pos, t0 = performance.now();
      if (reduceMotion()) { setPos(target); savePos(); return; }
      const step = now => {
        const k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3);
        setPos(from + (target - from) * e);
        anim = k < 1 ? requestAnimationFrame(step) : (savePos(), null);
      };
      anim = requestAnimationFrame(step);
    }

    (function initSheetGestures() {
      let x0, y0, lastY, lastT, v = 0, startPos = 0, mode = null, suppressClick = false;

      bsheet.addEventListener('touchstart', e => {
        if (isWide() || e.touches.length !== 1) { mode = 'none'; return; }
        suppressClick = stopMomentum(); // a tap that catches a moving list just stops it
        const t = e.touches[0];
        x0 = t.clientX; y0 = lastY = t.clientY; lastT = performance.now();
        v = 0; startPos = pos; mode = null;
      }, { passive: true });
      bsheet.addEventListener('touchmove', e => {
        if (mode === 'none' || mode === 'x') return;
        const t = e.touches[0];
        const dx = t.clientX - x0, dy = t.clientY - y0;
        if (mode === null) {
          if (Math.abs(dx) + Math.abs(dy) < 6) return;
          mode = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y'; // x: the headsign carousel handles it
          if (mode === 'x') return;
        }
        if (e.cancelable) e.preventDefault();
        setPos(startPos - dy);
        const now = performance.now(), dt = Math.max(1, now - lastT);
        v = 0.8 * (-(t.clientY - lastY) / dt) + 0.2 * v;
        lastY = t.clientY; lastT = now;
      }, { passive: false });
      const end = () => {
        if (mode === 'y') momentum(performance.now() - lastT > 80 ? 0 : v);
        mode = null;
      };
      bsheet.addEventListener('touchend', end);
      bsheet.addEventListener('touchcancel', end);
      bsheet.addEventListener('click', e => {
        if (suppressClick) { suppressClick = false; e.stopPropagation(); e.preventDefault(); }
      }, true);

      // Mouse wheel / trackpad: same continuous position.
      bsheet.addEventListener('wheel', e => {
        if (isWide() || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
        e.preventDefault();
        stopMomentum();
        setPos(pos + e.deltaY * (e.deltaMode === 1 ? 16 : 1));
        savePosSoon();
      }, { passive: false });

      // Mouse drag on the header.
      const head = document.getElementById('bsheetHead');
      let swallowClick = false;
      head.addEventListener('pointerdown', e => {
        if (e.pointerType !== 'mouse' || isWide()) return;
        stopMomentum();
        const yStart = e.clientY, p0 = pos;
        let dragging = false;
        const onMove = ev => {
          if (!dragging && Math.abs(ev.clientY - yStart) > 5) dragging = true;
          if (dragging) setPos(p0 - (ev.clientY - yStart));
        };
        const onUp = () => {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          if (dragging) { swallowClick = true; savePos(); setTimeout(() => { swallowClick = false; }, 0); }
        };
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      });
      head.addEventListener('click', e => { if (swallowClick) { e.stopPropagation(); e.preventDefault(); } }, true);

      // Handle tap / Enter: open the sheet if it's mostly down, otherwise lower it.
      const handle = document.getElementById('bsheetHandle');
      const toggle = () => animateTo(Math.min(pos, sheetTravel()) < sheetTravel() * 0.5 ? sheetTravel() : 0);
      handle.addEventListener('click', toggle);
      handle.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });

      const relayout = () => {
        if (map) map.invalidateSize();
        if (isWide()) { bsheet.style.removeProperty('--sheet-y'); scroller.scrollTop = 0; }
        else { const f = lsGet(POS_KEY, 0.45); setPos((isFinite(f) ? f : 0.45) * sheetTravel()); }
        followMap();
      };
      window.addEventListener('resize', debounce(relayout, 120));
      wideMQ.addEventListener('change', relayout);
    })();

    // ===== SERVICE ALERTS =====
    // /api/rt/alerts (GTFS-RT, route-level on YRT). An alert names the feed's route_id
    // ("1") while the board knows short names ("001", "purple"), so routes are compared
    // without leading zeros and through realRouteIds, learned from one /api/trip per
    // board route. Shown as one collapsed box above the board, a flag on the route's
    // card, and in full at the top of that route's / trip's view.
    const ALERTS_MS = 5 * 60 * 1000;
    let alerts = [], alertsAt = 0;
    const openAlerts = new Set(); // alert ids (and 'board' for the box) the rider has opened
    function warnIcon(cls) {
      return `<svg${cls ? ` class="${cls}"` : ''} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M12 3.5L2.5 20h19z"/><path d="M12 10v4.5M12 17.4v.1"/></svg>`;
    }
    const ICON_CHEV = '<svg class="alerts-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
    const ICON_STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.8z"/></svg>';

    const normRoute = r => String(r ?? '').replace(/^0+(?=.)/, '').toLowerCase();
    function alertText(t) {
      const tr = (t && t.translation) || [];
      return ((tr.find(x => String(x.language || '').startsWith('en')) || tr[0] || {}).text || '').trim();
    }
    function alertActive(al, now) {
